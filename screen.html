<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pantalla LED</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #000; font-family: Arial, Helvetica, sans-serif; }
    #screen { position: relative; width: 100vw; height: 100vh; overflow: hidden; background: #000; }
    video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    #layer { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
    .float { position: absolute; left: 0; top: 0; color: rgba(255,255,255,.86); font: 400 clamp(34px,4.8vw,82px)/1 Arial, Helvetica, sans-serif; white-space: nowrap; text-shadow: 0 0 2px rgba(255,255,255,.6), 0 0 14px rgba(255,255,255,.32); will-change: transform; }
    .firma { width: clamp(190px,25vw,450px); height: auto; filter: drop-shadow(0 0 2px rgba(255,255,255,.9)) drop-shadow(0 0 12px rgba(255,255,255,.35)); }
    .firma path { fill: none; stroke: rgba(255,255,255,.9); stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
    #status { position: fixed; right: 12px; bottom: 12px; padding: 8px 10px; border-radius: 6px; background: rgba(0,0,0,.45); color: rgba(255,255,255,.65); font: 13px Arial, Helvetica, sans-serif; }
  </style>
</head>
<body data-page="screen">
  <main id="screen">
    <video src="video.mp4" autoplay muted loop playsinline></video>
    <div id="layer"></div>
    <div id="status">Conectando</div>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
