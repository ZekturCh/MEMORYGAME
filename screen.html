<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Firma e Inspira · Pantalla LED</title>
  <link rel="stylesheet" href="css/firma-inspira.css?v=led-video">
</head>
<body data-page="screen">
  <main class="screen">
    <video class="screen-video" src="video.mp4?v=firma-inspira" autoplay muted loop playsinline aria-hidden="true"></video>
    <header class="screen-header">
      <h1><img class="screen-light" src="assets/firma-inspira/titulo-led.svg" alt="Firma e Inspira"></h1>
      <div class="screen-brand">
        <img class="screen-wordmark screen-light" src="assets/firma-inspira/credicorp.svg" alt="Credicorp">
        <img class="screen-tagline screen-light" src="assets/firma-inspira/credicorp-tagline.svg" alt="IA, Data y Ciberseguridad">
        <div class="screen-summit" role="img" aria-label="SUMMIT 2026"></div>
      </div>
    </header>
    <p id="emptyWall"><img class="screen-light" src="assets/firma-inspira/huella-led.svg" alt="Tu huella empieza aquí"></p>
    <div id="wall" aria-label="Muro de huellas">
      <div class="wall-grid"></div>
      <div class="wall-grid"></div>
    </div>
    <section id="spotlight" aria-label="Huella en juego" hidden>
      <div id="stageMark"></div>
      <div class="stage-timer"><progress id="timerBar" max="15" value="15"></progress><output id="seconds">15 s</output></div>
    </section>
    <p id="status" role="status">Conectando…</p>
    <button id="adminHotspot" type="button" aria-label="Abrir ajustes de pantalla"></button>
    <dialog id="adminPanel">
      <form method="dialog" class="admin-head">
        <h2>Ajustes de pantalla</h2>
        <button>Cerrar</button>
      </form>
      <div class="admin-settings">
        <label>Escala del fondo <input data-setting="videoScale" type="range" min="70" max="115"></label>
        <label>Estirar horizontal <input data-setting="videoStretchX" type="range" min="80" max="130"></label>
        <label>Estirar vertical <input data-setting="videoStretchY" type="range" min="80" max="130"></label>
        <label>Color de fondo <input data-setting="bgColor" type="color"></label>
        <label>Tamaño del texto en el muro <input data-setting="textSize" type="range" min="18" max="82"></label>
        <label>Tamaño de las firmas en el muro <input data-setting="signatureSize" type="range" min="100" max="520"></label>
      </div>
      <div class="control-group">
        <button id="clearVisible" type="button">Limpiar muro en esta pantalla</button>
        <button id="resetSettings" type="button">Restaurar ajustes</button>
      </div>
      <div id="adminList" aria-label="Huellas del muro"></div>
    </dialog>
  </main>
  <script type="module" src="js/led-brand.js"></script>
  <script type="module" src="app.js?v=turnos"></script>
</body>
</html>
