<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tablet</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; min-height: 100%; }
    body {
      min-height: 100vh;
      overflow: hidden;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at 18% 82%, rgba(214,0,33,.28) 0, transparent 30%),
        radial-gradient(circle at 82% 76%, rgba(255,255,255,.18) 0, transparent 28%),
        linear-gradient(140deg, #020307 0%, #061a37 45%, #010103 100%);
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background: rgba(0,0,0,.4);
    }
    button, input { font: inherit; }
    button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
    .scene {
      width: min(860px, 100%);
      height: 100vh;
      margin: 0 auto;
      padding: clamp(18px, 4vh, 42px) 18px;
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: clamp(18px, 4vh, 34px);
      align-items: center;
      position: relative;
      z-index: 1;
    }
    .brand {
      display: grid;
      place-items: center;
      align-content: center;
      gap: 0;
      min-height: 118px;
    }
    .brand img {
      object-fit: contain;
      filter: drop-shadow(0 8px 20px rgba(0,0,0,.8)) drop-shadow(0 0 10px rgba(255,255,255,.12));
    }
    .logo-menu {
      max-width: min(230px, 58vw);
      max-height: 72px;
    }
    .logo-73 {
      max-width: min(118px, 32vw);
      max-height: 34px;
      margin-top: -8px;
    }
    .brand-fallback {
      text-align: center;
      font-weight: 900;
      font-size: clamp(36px, 9vw, 78px);
      line-height: .85;
      letter-spacing: 0;
      text-shadow: 0 0 22px rgba(255,255,255,.28);
    }
    .brand-fallback span {
      display: block;
      margin-top: 10px;
      color: #ed1029;
      font-size: .45em;
      line-height: 1;
    }
    .view {
      width: 100%;
      display: none;
      place-items: center;
      gap: 22px;
    }
    .view.active { display: grid; }
    .title {
      margin: 0;
      text-align: center;
      font-size: clamp(36px, 8vw, 70px);
      line-height: .95;
      font-weight: 900;
      text-transform: uppercase;
      text-shadow: 0 5px 24px rgba(0,0,0,.55);
    }
    .choices {
      width: min(620px, 100%);
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: clamp(16px, 4vw, 28px);
    }
    .choice {
      min-height: clamp(210px, 42vh, 330px);
      border-radius: 28px;
      background: rgba(0,0,0,.46);
      color: #fff;
      font-size: clamp(20px, 4vw, 30px);
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0;
      box-shadow: inset 0 0 42px rgba(0,0,0,.7), 0 20px 60px rgba(0,0,0,.32);
    }
    .choice-red {
      border: 4px solid #ed1029;
      text-shadow: 0 0 16px rgba(237,16,41,.72);
    }
    .choice-white {
      border: 4px solid #fff;
      color: #fff;
      text-shadow: 0 0 16px rgba(255,255,255,.7);
    }
    .panel {
      width: min(680px, 100%);
      display: grid;
      gap: 16px;
      padding: clamp(18px, 4vw, 28px);
      border: 1px solid rgba(255,255,255,.22);
      border-radius: 18px;
      background: rgba(0,0,0,.5);
      box-shadow: 0 22px 70px rgba(0,0,0,.42);
      backdrop-filter: blur(4px);
    }
    label {
      font-size: clamp(22px, 5vw, 34px);
      font-weight: 900;
      text-transform: uppercase;
    }
    input {
      width: 100%;
      min-height: 76px;
      padding: 0 18px;
      border: 2px solid rgba(255,255,255,.35);
      border-radius: 12px;
      outline: 0;
      background: rgba(0,0,0,.7);
      color: #fff;
      font-size: clamp(24px, 6vw, 42px);
      font-weight: 800;
    }
    canvas {
      width: 100%;
      aspect-ratio: 16 / 7;
      display: block;
      border: 2px solid rgba(255,255,255,.35);
      border-radius: 12px;
      background: rgba(0,0,0,.78);
      touch-action: none;
    }
    .actions {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }
    .actions button {
      min-height: 62px;
      border: 0;
      border-radius: 12px;
      padding: 0 14px;
      font-weight: 900;
      font-size: clamp(15px, 3.4vw, 22px);
      text-transform: uppercase;
    }
    .back, .clean {
      border: 1px solid rgba(255,255,255,.28) !important;
      background: rgba(255,255,255,.1);
      color: #fff;
    }
    .send {
      background: #ed1029;
      color: #fff;
      box-shadow: 0 0 24px rgba(237,16,41,.38);
    }
    #sentView { min-height: 48vh; }
    #sentView p {
      margin: 0;
      text-align: center;
      font-size: clamp(34px, 8vw, 72px);
      line-height: 1;
      font-weight: 900;
      text-transform: uppercase;
      text-shadow: 0 0 28px rgba(255,255,255,.4), 0 6px 26px rgba(0,0,0,.65);
    }
    #status {
      min-height: 22px;
      margin: 0;
      text-align: center;
      color: rgba(255,255,255,.7);
      font-size: 14px;
      font-weight: 700;
    }
    #status.error { color: #ff7184; }
    @media (max-width: 620px) {
      body { overflow: auto; }
      .scene { min-height: 100vh; height: auto; }
      .choices { grid-template-columns: 1fr; }
      .choice { min-height: 150px; border-radius: 20px; }
      .actions { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body data-page="tablet">
  <main class="scene">
    <header class="brand">
      <img class="logo-menu" src="logo-menu.png" alt="ALAFARPE" onerror="this.onerror=null;this.src='logo-men%C3%BA.png'">
      <img class="logo-73" src="logo-73-anios-03.png" alt="73 anos">
    </header>

    <input id="room" type="hidden" value="demo">

    <section id="menuView" class="view active">
      <h1 class="title">Elige tu opcion</h1>
      <div class="choices">
        <button id="chooseName" class="choice choice-red" type="button">Escribir nombre</button>
        <button id="chooseSignature" class="choice choice-white" type="button">Dibujar firma</button>
      </div>
    </section>

    <section id="nameView" class="view">
      <form id="nameForm" class="panel">
        <label for="name">Escribir nombre</label>
        <input id="name" maxlength="48" autocomplete="off">
        <div class="actions">
          <button id="backName" class="back" type="button">Regresar</button>
          <button id="clearName" class="clean" type="button">Limpiar</button>
          <button class="send" type="submit">Enviar</button>
        </div>
      </form>
    </section>

    <section id="signatureView" class="view">
      <div class="panel">
        <label for="pad">Dibujar firma</label>
        <canvas id="pad"></canvas>
        <div class="actions">
          <button id="backSignature" class="back" type="button">Regresar</button>
          <button id="clearPad" class="clean" type="button">Limpiar</button>
          <button id="sendSignature" class="send" type="button">Enviar</button>
        </div>
      </div>
    </section>

    <section id="sentView" class="view">
      <p>Mensaje enviado</p>
    </section>

    <p id="status">Listo</p>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
