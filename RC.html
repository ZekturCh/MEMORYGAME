<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>ParalelVR · Puzzle Valores · Validación final</title>
<style>
:root {
  --bg:#050814;
  --cyan:#00e5ff;
  --magenta:#ff2ad4;
  --violet:#7c3cff;
  --good:#8cf7d2;
  --text:#f7fbff;
  --muted:#9aaccc;
}
* { box-sizing:border-box; }
html,body {
  margin:0; width:100%; height:100%; min-height:100%;
  background:var(--bg); color:var(--text);
  font-family:Inter,Segoe UI,Arial,sans-serif;
  overscroll-behavior:none;
  touch-action:manipulation;
}
body {
  overflow:hidden;
  background:
    radial-gradient(circle at 50% 0%, rgba(0,229,255,.12), transparent 28%),
    radial-gradient(circle at 50% 100%, rgba(255,42,212,.10), transparent 30%),
    #050814;
}
.app {
  width:100%;
  height:100dvh;
  min-height:100vh;
  display:grid;
  grid-template-rows:auto 1fr auto;
  gap:10px;
  padding:max(10px, env(safe-area-inset-top)) 12px max(12px, env(safe-area-inset-bottom));
}
.top {
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  min-height:52px;
}
.brand {
  display:flex;
  align-items:center;
  gap:10px;
  min-width:0;
}
.brand img {
  width:auto;
  height:38px;
  max-width:150px;
  object-fit:contain;
  filter:drop-shadow(0 0 14px rgba(0,229,255,.22));
}
.current {
  min-width:0;
  display:flex;
  flex-direction:column;
  gap:2px;
}
.current small {
  color:var(--muted);
  font-size:10px;
  letter-spacing:.18em;
  text-transform:uppercase;
}
.current strong {
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  font-size:clamp(16px,4vw,24px);
  background:linear-gradient(90deg,var(--cyan),#fff,var(--magenta));
  -webkit-background-clip:text;
  color:transparent;
}
.progress {
  flex:0 0 auto;
  padding:8px 11px;
  border-radius:999px;
  border:1px solid rgba(255,255,255,.12);
  background:rgba(10,17,34,.82);
  font-weight:800;
  font-size:12px;
}
.stage {
  min-height:0;
  display:flex;
  align-items:center;
  justify-content:center;
}
.board-shell {
  position:relative;
  width:min(94vw, 72vh);
  max-width:760px;
  aspect-ratio:1/1;
  border-radius:26px;
  padding:7px;
  background:linear-gradient(135deg,rgba(0,229,255,.52),rgba(124,60,255,.38),rgba(255,42,212,.50));
  box-shadow:
    0 28px 70px rgba(0,0,0,.42),
    0 0 55px rgba(0,229,255,.10);
}
.board {
  width:100%;
  height:100%;
  position:relative;
  overflow:hidden;
  border-radius:20px;
  background:#060b16;
  display:grid;
  grid-template-columns:1fr 1fr;
  grid-template-rows:1fr 1fr;
}
.quadrant {
  position:relative;
  overflow:hidden;
  border:1px solid rgba(255,255,255,.05);
  background:#08101f;
  isolation:isolate;
}
.full-image {
  position:absolute;
  inset:0;
  background-size:200% 200%;
  background-repeat:no-repeat;
  transform:scale(1.01);
  transition:.35s ease;
  filter:saturate(.55) brightness(.24);
}
.q0 .full-image { background-position:0 0; }
.q1 .full-image { background-position:100% 0; }
.q2 .full-image { background-position:0 100%; }
.q3 .full-image { background-position:100% 100%; }

.quadrant.completed .full-image {
  filter:saturate(1.05) brightness(1);
}
.quadrant.active .full-image {
  filter:saturate(.96) brightness(.88);
}
.quadrant:not(.completed):not(.active) .full-image {
  filter:saturate(.18) brightness(.12);
}

.target-svg {
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  z-index:6;
  overflow:visible;
  pointer-events:none;
}
.target-svg polygon {
  fill:rgba(3,7,16,.94);
  stroke:rgba(255,255,255,.22);
  stroke-width:.85;
  vector-effect:non-scaling-stroke;
  transition:fill .2s ease, stroke .2s ease, filter .2s ease, opacity .2s ease;
}
.target-svg polygon.placed {
  fill:transparent;
  stroke:rgba(140,247,210,.24);
  opacity:.38;
}
.locked-piece {
  position:absolute;
  inset:0;
  z-index:5;
  background-size:200% 200%;
  background-repeat:no-repeat;
  animation:snap .22s cubic-bezier(.2,.85,.2,1.2) both;
}
.q0 .locked-piece { background-position:0 0; }
.q1 .locked-piece { background-position:100% 0; }
.q2 .locked-piece { background-position:0 100%; }
.q3 .locked-piece { background-position:100% 100%; }
@keyframes snap {
  from { opacity:.15; transform:scale(.84); filter:brightness(2); }
  to { opacity:1; transform:scale(1); filter:none; }
}
.stage-tag {
  position:absolute;
  z-index:12;
  top:10px;
  left:10px;
  font-size:10px;
  line-height:1;
  font-weight:900;
  letter-spacing:.1em;
  padding:7px 9px;
  border-radius:999px;
  background:rgba(4,9,20,.75);
  border:1px solid rgba(255,255,255,.14);
  opacity:.28;
}
.quadrant.active .stage-tag {
  opacity:1;
  border-color:rgba(0,229,255,.5);
  color:#fff;
}
.quadrant.completed .stage-tag {
  opacity:.82;
  color:var(--good);
}
.final {
  position:absolute;
  inset:7px;
  z-index:30;
  border-radius:20px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:28px;
  background:linear-gradient(180deg,rgba(4,8,20,.12),rgba(4,8,20,.74));
  opacity:0;
  visibility:hidden;
  transform:scale(.97);
  transition:.45s ease;
}
.final.show {
  opacity:1;
  visibility:visible;
  transform:scale(1);
}
.final img {
  width:min(46vw,310px);
  max-height:100px;
  object-fit:contain;
  margin-bottom:14px;
  filter:drop-shadow(0 0 22px rgba(0,229,255,.28));
}
.final h2 {
  margin:0;
  font-size:clamp(26px,7vw,54px);
  line-height:.95;
}
.final p {
  margin:12px 0 0;
  max-width:620px;
  font-size:clamp(13px,3.5vw,19px);
  color:#e4edff;
}
.tray-area {
  display:grid;
  grid-template-rows:auto auto;
  gap:8px;
  align-self:end;
}
.tray {
  width:100%;
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:8px;
}
.piece {
  position:relative;
  width:100%;
  aspect-ratio:1;
  cursor:grab;
  touch-action:none;
  user-select:none;
  -webkit-user-select:none;
  transition:transform .18s ease, opacity .18s ease, filter .18s ease;
  display:flex;
  align-items:center;
  justify-content:center;
}
.piece svg {
  width:94%;
  height:94%;
  overflow:visible;
  filter:drop-shadow(0 8px 12px rgba(0,0,0,.42)) drop-shadow(0 0 8px rgba(0,229,255,.10));
}
.piece:hover {
  transform:translateY(-2px) scale(1.02);
  filter:brightness(1.08);
}
.piece.dragging {
  position:fixed !important;
  width:clamp(92px,19vw,155px) !important;
  height:clamp(92px,19vw,155px) !important;
  z-index:9999;
  transform:scale(1.05);
  transition:none;
  cursor:grabbing;
  filter:drop-shadow(0 18px 30px rgba(0,0,0,.58));
}
.piece.used {
  opacity:.06;
  pointer-events:none;
  transform:scale(.84);
}
.mini-line {
  width:100%;
  height:5px;
  border-radius:999px;
  background:#111a31;
  overflow:hidden;
}
.mini-line > span {
  display:block;
  height:100%;
  width:0;
  background:linear-gradient(90deg,var(--cyan),var(--violet),var(--magenta));
  box-shadow:0 0 14px rgba(0,229,255,.5);
  transition:width .35s ease;
}

.placed-visual {
  position:absolute;
  z-index:8;
  pointer-events:none;
  display:flex;
  align-items:center;
  justify-content:center;
  transform-origin:center;
}
.placed-visual svg {
  width:100%;
  height:100%;
  overflow:visible;
  filter:drop-shadow(0 5px 10px rgba(0,0,0,.38));
}
.placed-visual.correct {
  animation:correctPulse .45s ease both;
}
.placed-visual.wrong {
  animation:wrongPulse .72s ease both;
  filter:drop-shadow(0 0 12px rgba(255,46,76,.95));
}
.target-svg polygon.wrong {
  fill:rgba(255,30,58,.34);
  stroke:#ff3557;
  filter:drop-shadow(0 0 8px rgba(255,30,58,.9));
}
.target-svg polygon.correct {
  fill:transparent;
  stroke:rgba(140,247,210,.28);
}
@keyframes wrongPulse {
  0%,100% { transform:translateX(0); filter:drop-shadow(0 0 0 rgba(255,40,70,0)); }
  18% { transform:translateX(-6px); filter:drop-shadow(0 0 16px rgba(255,40,70,.95)); }
  36% { transform:translateX(6px); }
  54% { transform:translateX(-5px); }
  72% { transform:translateX(4px); }
}
@keyframes correctPulse {
  0% { transform:scale(.96); }
  55% { transform:scale(1.04); filter:drop-shadow(0 0 12px rgba(140,247,210,.65)); }
  100% { transform:scale(1); }
}

.toast {
  position:fixed;
  left:50%;
  bottom:calc(120px + env(safe-area-inset-bottom));
  z-index:10000;
  transform:translate(-50%,18px);
  opacity:0;
  pointer-events:none;
  padding:9px 13px;
  border-radius:999px;
  background:rgba(5,11,24,.94);
  border:1px solid rgba(255,255,255,.13);
  color:#fff;
  font-size:12px;
  transition:.2s ease;
}
.toast.show {
  opacity:1;
  transform:translate(-50%,0);
}
.confetti {
  position:fixed;
  width:8px;
  height:14px;
  z-index:9998;
  pointer-events:none;
  border-radius:2px;
  animation:fall 1.5s linear forwards;
}
@keyframes fall {
  from { transform:translateY(-12vh) rotate(0); opacity:1; }
  to { transform:translateY(112vh) rotate(720deg); opacity:.12; }
}

/* Totem vertical prioritario: 1080x1920 / 9:16 */
@media (orientation:portrait) {
  .app { grid-template-rows:auto minmax(0,1fr) auto; }
  .stage { align-items:flex-start; padding-top:2px; }
  .board-shell {
    width:min(94vw, 67vh);
    max-width:none;
  }
  .tray-area { padding-bottom:2px; }
}

/* Pantallas pequeñas: la interfaz sigue completa y sin scroll */
@media (max-width:600px) {
  .app { padding-left:9px; padding-right:9px; gap:8px; }
  .top { min-height:44px; }
  .brand img { height:31px; max-width:115px; }
  .current small { display:none; }
  .progress { padding:7px 9px; font-size:11px; }
  .board-shell { border-radius:20px; padding:5px; }
  .board { border-radius:15px; }
  .final { inset:5px; border-radius:15px; }
  .stage-tag { top:7px; left:7px; padding:5px 7px; font-size:9px; }
  .tray { gap:5px; }
}
</style>
</head>

    <div class="brand">
      <img id="brandLogo" alt="Paralel VR">
      <div class="current">

        <div class="quadrant q1" data-q="1">

        <div class="quadrant q2" data-q="2">

          <div class="full-image"></div>
          <svg class="target-svg" viewBox="0 0 100 100"></svg>

      <div class="final" id="finalOverlay">
        <img id="finalLogo" alt="Paralel VR">
        <h2>¡Lo construimos juntos!</h2>
        <p>Cada persona aporta una pieza para construir algo más grande.</p>
      </div>

  </section>

  <section class="tray-area">
    <div class="mini-line"><span id="progressFill"></span></div>
    <div class="tray" id="pieceTray"></div>
  </section>
</div>

<div class="toast" id="toast">¡Pieza correcta!</div>

const PIECES = [
  // Cinco huecos independientes. Se parecen entre sí a propósito:
  // el jugador debe fijarse tanto en la silueta como en la continuidad de la imagen.
  { points:"12,12 29,9 39,17 37,31 24,37 11,29 8,20", center:[23,23] },
  { points:"60,11 76,8 88,17 86,31 73,38 59,31 56,20", center:[73,23] },
  { points:"37,40 52,36 64,44 65,57 53,65 38,60 34,50", center:[50,50] },
  { points:"13,65 28,61 40,69 39,83 27,91 13,85 9,75", center:[24,76] },
  { points:"61,64 77,60 89,69 88,83 75,91 61,84 57,74", center:[74,76] }
];

const CLIPS = PIECES.map(p => "polygon(" + p.points.split(" ").map(pt => {
  const [x,y] = pt.split(",");
  return x+"% "+y+"%";
}).join(",") + ")");

const q = s => document.querySelector(s);
const qa = s => [...document.querySelectorAll(s)];

let currentStage = 0;
let totalPlaced = 0;

// slot -> piece. Se conserva hasta que la etapa termine.
// Esto permite que una pieza equivocada pueda quedarse colocada
// hasta que se hayan llenado los 5 huecos y recién entonces se valide.
let placements = new Map();
let validating = false;
let puzzleImage = FALLBACK_IMAGE;
let logoImage = FALLBACK_LOGO;

function testImage(src) {
  return new Promise(resolve => {
    const im = new Image();
    im.onload = () => resolve(src);
    im.onerror = () => resolve(null);
    im.src = src + (src.startsWith("data:") ? "" : "?v=" + Date.now());
  });
}

async function loadAssets() {
  const [img, logo] = await Promise.all([
    testImage(CONFIG.finalImageFile),
    testImage(CONFIG.logoFile)
  ]);
  puzzleImage = img || FALLBACK_IMAGE;
  logoImage = logo || FALLBACK_LOGO;
  qa(".full-image").forEach(el => el.style.backgroundImage = `url("${puzzleImage}")`);
  q("#brandLogo").src = logoImage;
  q("#finalLogo").src = logoImage;
}

function buildTargets(quadrant) {
  const svg = quadrant.querySelector(".target-svg");
  svg.innerHTML = "";
  PIECES.forEach((p,i) => {
    const poly = document.createElementNS("http://www.w3.org/2000/svg","polygon");
    poly.setAttribute("points",p.points);
    poly.dataset.piece = i;
    svg.appendChild(poly);
  });
}

function activeQuadrant() {
  return q(`.quadrant[data-q="${currentStage}"]`);
}

function setStage(stage) {
  currentStage = stage;
  placements = new Map();
  validating = false;

  qa(".quadrant").forEach((el,i) => {
    el.classList.toggle("active", i === stage);
    if(i < stage) el.classList.add("completed");
    el.querySelector(".target-svg").style.display = i === stage ? "block" : "none";
  });

  q("#stageValue").textContent = CONFIG.values[stage];
  createTray();
}


function pieceSVG(index, stage) {
  const pts = PIECES[index].points.split(" ").map(pair => pair.split(",").map(Number));
  const xs = pts.map(p=>p[0]), ys = pts.map(p=>p[1]);
  const minX = Math.min(...xs)-3, maxX = Math.max(...xs)+3;
  const minY = Math.min(...ys)-3, maxY = Math.max(...ys)+3;
  const w = maxX-minX, h = maxY-minY;

  // La imagen final se mapea a 200x200; cada etapa ve uno de sus cuadrantes 100x100.
  const offsetX = (stage % 2) * -100;
  const offsetY = (stage > 1 ? -100 : 0);
  const clipId = `pv-hole-${stage}-${index}-${Math.random().toString(36).slice(2,8)}`;

  return `
    <svg viewBox="${minX} ${minY} ${w} ${h}" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
      <defs>
        <clipPath id="${clipId}">
          <polygon points="${PIECES[index].points}"></polygon>
        </clipPath>
      </defs>
      <image href="${puzzleImage}"
             x="${offsetX}" y="${offsetY}"
             width="200" height="200"
             preserveAspectRatio="none"
             clip-path="url(#${clipId})"></image>
      <polygon points="${PIECES[index].points}"
               fill="none"
               stroke="rgba(255,255,255,.72)"
               stroke-width="1.1"
               vector-effect="non-scaling-stroke"></polygon>
    </svg>`;
}

function createTray() {
  const tray = q("#pieceTray");
  tray.innerHTML = "";
  const order = [0,1,2,3,4].sort(() => Math.random()-.5);

  order.forEach(i => {
    const el = document.createElement("div");
    el.className = "piece";
    el.dataset.piece = i;
    el.dataset.q = currentStage;
    el.innerHTML = pieceSVG(i,currentStage);
    bindDrag(el);
    tray.appendChild(el);
  });
}

function slotPosition(slotIndex) {
  const rect = activeQuadrant().getBoundingClientRect();
  const [cx,cy] = PIECES[slotIndex].center;
  return {
    x: rect.left + rect.width * cx/100,
    y: rect.top  + rect.height* cy/100,
    radius: Math.min(rect.width,rect.height)*0.17
  };
}

function nearestOpenSlot(x,y) {
  let best = null;
  for(let slot=0; slot<5; slot++) {
    if(placements.has(slot)) continue;
    const t = slotPosition(slot);
    const d = Math.hypot(x-t.x,y-t.y);
    if(d <= t.radius && (!best || d < best.distance)) {
      best = {slot, distance:d};
    }
  }
  return best ? best.slot : null;
}





function bindDrag(el) {
  let active=false, dx=0, dy=0;

  el.addEventListener("pointerdown", e => {
    if(el.classList.contains("used") || validating) return;
    e.preventDefault();
    active = true;
    const r = el.getBoundingClientRect();
    dx = e.clientX-r.left;
    dy = e.clientY-r.top;
    el.setPointerCapture?.(e.pointerId);
    el.classList.add("dragging");
    el.style.left = (e.clientX-dx)+"px";
    el.style.top = (e.clientY-dy)+"px";
  });

  el.addEventListener("pointermove", e => {
    if(!active) return;
    e.preventDefault();
    el.style.left = (e.clientX-dx)+"px";
    el.style.top  = (e.clientY-dy)+"px";
  });

  const end = e => {
    if(!active) return;
    active=false;

    const slot = nearestOpenSlot(e.clientX,e.clientY);
    el.classList.remove("dragging");

    if(slot !== null) {
      placePieceInSlot(+el.dataset.piece, slot, el);
    } else {
      el.style.left = "";
      el.style.top = "";
      showToast("Suelta la pieza dentro de un hueco");
    }
  };

  el.addEventListener("pointerup",end);
  el.addEventListener("pointercancel",end);
}



function polygonBounds(slotIndex) {
  const pts = PIECES[slotIndex].points.split(" ").map(pair => pair.split(",").map(Number));
  const xs = pts.map(p=>p[0]), ys = pts.map(p=>p[1]);
  const minX = Math.min(...xs), maxX = Math.max(...xs);
  const minY = Math.min(...ys), maxY = Math.max(...ys);
  return {x:minX, y:minY, w:maxX-minX, h:maxY-minY};
}

function placePieceInSlot(pieceIndex, slotIndex, trayPiece) {
  if(validating || placements.has(slotIndex)) return;

  placements.set(slotIndex, pieceIndex);
  trayPiece.classList.add("used");
  trayPiece.style.left = "";
  trayPiece.style.top = "";

  const quad = activeQuadrant();
  const b = polygonBounds(slotIndex);
  const visual = document.createElement("div");
  visual.className = "placed-visual";
  visual.dataset.slot = slotIndex;
  visual.dataset.piece = pieceIndex;
  visual.style.left = b.x + "%";
  visual.style.top = b.y + "%";
  visual.style.width = b.w + "%";
  visual.style.height = b.h + "%";
  visual.innerHTML = pieceSVG(pieceIndex,currentStage);
  quad.appendChild(visual);

  showToast(`Pieza colocada · ${placements.size}/5`);

  if(placements.size === 5) {
    setTimeout(validatePlacements, 260);
  }
}

function validatePlacements() {
  if(validating || placements.size < 5) return;
  validating = true;

  const quad = activeQuadrant();
  const wrongSlots = [];
  let correctCount = 0;

  placements.forEach((pieceIndex, slotIndex) => {
    const visual = quad.querySelector(`.placed-visual[data-slot="${slotIndex}"]`);
    const poly = quad.querySelector(`polygon[data-piece="${slotIndex}"]`);

    if(pieceIndex === slotIndex) {
      correctCount++;
      visual?.classList.add("correct");
      poly?.classList.add("correct");
    } else {
      wrongSlots.push(slotIndex);
      visual?.classList.add("wrong");
      poly?.classList.add("wrong");
    }
  });

  if(correctCount === 5) {
    showToast("¡Perfecto! Las 5 piezas están correctas");
    setTimeout(() => completeStage(), 650);
    return;
  }

  showToast(`${wrongSlots.length} ${wrongSlots.length === 1 ? "pieza incorrecta" : "piezas incorrectas"}`);

  // Las equivocadas parpadean en rojo y regresan a la bandeja.
  setTimeout(() => {
    wrongSlots.forEach(slotIndex => {
      const pieceIndex = placements.get(slotIndex);
      const visual = quad.querySelector(`.placed-visual[data-slot="${slotIndex}"]`);
      const poly = quad.querySelector(`polygon[data-piece="${slotIndex}"]`);
      visual?.remove();
      poly?.classList.remove("wrong");

      const trayPiece = q(`.piece[data-piece="${pieceIndex}"]`);
      if(trayPiece) trayPiece.classList.remove("used");

      placements.delete(slotIndex);
    });

    // Las correctas quedan bloqueadas y el hueco se revela.
    placements.forEach((pieceIndex, slotIndex) => {
      if(pieceIndex !== slotIndex) return;
      const visual = quad.querySelector(`.placed-visual[data-slot="${slotIndex}"]`);
      const poly = quad.querySelector(`polygon[data-piece="${slotIndex}"]`);
      visual?.remove();
      poly?.classList.add("placed");
      poly?.classList.remove("correct");
    });

    validating = false;
  }, 850);
}

function completeStage() {
  const quad = activeQuadrant();

  // Oculta las piezas superpuestas: la imagen base ya contiene la imagen final.
  quad.querySelectorAll(".placed-visual").forEach(el => el.remove());
  quad.querySelectorAll(".target-svg polygon").forEach(poly => {
    poly.classList.add("placed");
    poly.classList.remove("wrong","correct");
  });

  totalPlaced += 5;
  q("#peopleCount").textContent = totalPlaced;
  q("#progressFill").style.width = (totalPlaced/20*100)+"%";

  quad.classList.remove("active");
  quad.classList.add("completed");
  quad.querySelector(".target-svg").style.display = "none";

  setTimeout(() => {
    if(currentStage < 3) {
      setStage(currentStage+1);
    } else {
      finish();
    }
  }, CONFIG.nextStageDelay);
}

function finish() {
  qa(".quadrant").forEach(el => {
    el.classList.add("completed");
    el.classList.remove("active");
    el.querySelector(".target-svg").style.display="none";
  });
  q("#stageValue").textContent = "COMPLETADO";
  q("#finalOverlay").classList.add("show");
  confetti();
}

function resetGame() {
  totalPlaced=0;
  placements = new Map();
  validating = false;
  q("#peopleCount").textContent="0";
  q("#progressFill").style.width="0%";
  q("#finalOverlay").classList.remove("show");
  qa(".locked-piece,.placed-visual").forEach(el=>el.remove());
  qa(".quadrant").forEach(el => {
    el.classList.remove("completed","active");
    buildTargets(el);
  });
  setStage(0);
}

function showToast(msg) {
  const t=q("#toast");
  t.textContent=msg;
  t.classList.add("show");
  clearTimeout(showToast.timer);
  showToast.timer=setTimeout(()=>t.classList.remove("show"),650);
}

function confetti() {
  const colors=["#00e5ff","#ff2ad4","#7c3cff","#fff","#8cf7d2"];
  for(let i=0;i<50;i++) {
    const c=document.createElement("div");
    c.className="confetti";
    c.style.left=Math.random()*100+"vw";
    c.style.top=(-10-Math.random()*20)+"px";
    c.style.background=colors[i%colors.length];
    c.style.animationDelay=(Math.random()*.45)+"s";
    c.style.animationDuration=(1.1+Math.random()*.8)+"s";
    document.body.appendChild(c);
    setTimeout(()=>c.remove(),2200);
  }
}

async function init() {
  await loadAssets();
  qa(".quadrant").forEach(buildTargets);
  setStage(0);

  // Reinicio oculto para operación: mantener presionado el logo 1.2 s
  let timer=null;
  q("#brandLogo").addEventListener("pointerdown",()=>timer=setTimeout(resetGame,1200));
  ["pointerup","pointerleave","pointercancel"].forEach(evt =>
    q("#brandLogo").addEventListener(evt,()=>clearTimeout(timer))
  );
}
init();
</script>
