<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#050619">
  <title>Firma e Inspira · Pizarra Mágica</title>
  <link rel="stylesheet" href="css/firma-inspira.css">
</head>
<body>
  <main class="tablet launch">
    <header>
      <div class="brand"><b>CREDICORP</b><span>IA, Data &amp; Ciberseguridad</span><strong>SUMMIT 2026</strong></div>
      <h1>Firma e Inspira</h1>
      <p>Pizarra Mágica</p>
    </header>
    <nav aria-label="Modo de la pizarra">
      <a class="primary" href="tablet.html">Abrir tablet <span aria-hidden="true">→</span></a>
      <a class="primary" href="screen.html">Abrir pantalla LED <span aria-hidden="true">→</span></a>
    </nav>
  </main>
  <script>
    const room = new URLSearchParams(location.search).get("room");
    if (room) {
      for (const link of document.querySelectorAll("nav a")) {
        const url = new URL(link.href);
        url.searchParams.set("room", room);
        link.href = url.href;
      }
    }
  </script>
</body>
</html>
