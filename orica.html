<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#003f76">
<title>ORICA · Juego de Memoria</title>
<style>
:root {
  --navy:#003b70;
  --navy2:#062e5c;
  --blue:#009fe3;
  --blue2:#28b7ed;
  --ice:#eaf8ff;
  --white:#fff;
  --text:#073a68;
  --panel:rgba(255,255,255,.12);
  --line:rgba(255,255,255,.25);
  --shadow:0 20px 55px rgba(0,35,72,.32);
  --radius:22px;
  --gap:clamp(9px,1.35vw,16px);
  --safe-top:env(safe-area-inset-top,0px);
  --safe-right:env(safe-area-inset-right,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
  --safe-left:env(safe-area-inset-left,0px);
}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{
  font-family:Inter,Segoe UI,Arial,sans-serif;
  color:#fff;
  background:
    radial-gradient(circle at 18% 12%,rgba(77,203,248,.42),transparent 26%),
    radial-gradient(circle at 82% 78%,rgba(17,151,218,.32),transparent 30%),
    linear-gradient(145deg,#00528e 0%,#003b70 48%,#01284f 100%);
  -webkit-tap-highlight-color:transparent;
  user-select:none;
}
body::before{
  content:"";position:fixed;inset:-25%;pointer-events:none;opacity:.22;
  background:repeating-radial-gradient(circle at 50% 52%,transparent 0 38px,rgba(123,220,255,.55) 39px 44px,transparent 45px 78px);
}
button{font:inherit}
img{display:block;pointer-events:none;-webkit-user-drag:none}
#app{position:relative;width:100%;height:100%;padding:var(--safe-top) var(--safe-right) var(--safe-bottom) var(--safe-left)}
.screen{position:absolute;inset:0;display:none;min-width:0;min-height:0}
.screen.active{display:flex}
#menu{
  align-items:center;justify-content:center;flex-direction:column;gap:26px;padding:28px;
}
.menu-logo{
  width:min(330px,54vw,34vh);max-height:42vh;object-fit:contain;
  filter:drop-shadow(0 18px 28px rgba(0,24,55,.28));
}
.menu-subtitle{
  margin-top:-18px;font-size:clamp(13px,2vw,20px);font-weight:800;letter-spacing:.22em;text-transform:uppercase;color:#dff6ff;
}
.play{
  min-width:clamp(190px,31vw,310px);min-height:74px;padding:15px 40px;border:2px solid rgba(255,255,255,.9);
  border-radius:999px;background:linear-gradient(180deg,#fff,#dff6ff);color:var(--navy);
  font-size:clamp(30px,5vw,50px);font-weight:900;letter-spacing:.08em;cursor:pointer;
  box-shadow:0 0 0 7px rgba(0,159,227,.35),0 18px 35px rgba(0,27,58,.35),inset 0 2px 0 #fff;
  transition:transform .13s ease,filter .13s ease;
}
.play:active,.btn:active{transform:scale(.96)}
#game{
  flex-direction:column;gap:10px;
  padding:calc(10px + var(--safe-top)) calc(12px + var(--safe-right)) calc(10px + var(--safe-bottom)) calc(12px + var(--safe-left));
}
.header{
  flex:0 0 auto;display:grid;grid-template-columns:minmax(48px,1fr) auto minmax(48px,1fr);align-items:center;gap:10px;
  padding:8px 10px;border:1px solid var(--line);border-radius:20px;background:rgba(0,44,86,.58);
  box-shadow:0 12px 30px rgba(0,26,58,.22);backdrop-filter:blur(12px);
}
.brand-mini{justify-self:start;display:flex;align-items:center;gap:8px;min-width:0}
.brand-mini img{width:48px;height:48px;object-fit:contain}
.brand-mini strong{font-size:14px;letter-spacing:.08em}
.stats{display:flex;align-items:center;justify-content:center;gap:clamp(16px,4vw,40px)}
.stat{display:flex;flex-direction:column;align-items:center;line-height:1}
.stat b{font-size:clamp(20px,2.8vw,28px);color:#fff}
.stat span{margin-top:4px;font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:#bfeeff;font-weight:800}
.actions{justify-self:end;display:flex;gap:8px}
.btn{
  min-width:46px;min-height:46px;padding:10px 14px;border:1px solid rgba(255,255,255,.25);border-radius:999px;
  background:rgba(255,255,255,.10);color:#fff;font-weight:800;cursor:pointer;transition:transform .12s ease,filter .12s ease;
}
.btn:hover,.play:hover{filter:brightness(1.07)}
.play-panel{
  flex:1 1 auto;min-width:0;min-height:0;display:flex;flex-direction:column;overflow:hidden;
  border:1px solid rgba(255,255,255,.18);border-radius:26px;
  background:linear-gradient(145deg,rgba(255,255,255,.12),rgba(255,255,255,.055));
  box-shadow:inset 0 0 60px rgba(0,22,49,.22),0 18px 40px rgba(0,20,45,.16);
  backdrop-filter:blur(8px);
}
.board{
  flex:1 1 auto;min-width:0;min-height:0;display:grid;
  grid-template-columns:repeat(var(--cols,5),var(--card-w,120px));
  grid-template-rows:repeat(var(--rows,2),var(--card-h,160px));
  gap:var(--gap);justify-content:center;align-content:center;
  padding:clamp(10px,1.5vw,18px);
}
.value-message{
  flex:0 0 auto;min-height:clamp(82px,11vh,116px);
  margin:0 clamp(10px,1.5vw,18px) clamp(10px,1.5vw,18px);
  padding:clamp(12px,1.5vw,17px) clamp(14px,2vw,24px);
  display:flex;align-items:center;justify-content:center;text-align:center;
  border:1px solid rgba(255,255,255,.17);border-radius:18px;
  background:linear-gradient(145deg,rgba(0,54,104,.44),rgba(0,107,165,.22));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.08);
}
.value-copy{max-width:min(900px,94%);will-change:transform,opacity}
.value-title{
  margin:0 0 5px;color:#8be4ff;font-size:clamp(17px,2.2vw,25px);font-weight:900;
  letter-spacing:.08em;text-transform:uppercase;line-height:1.05;
}
.value-phrase{
  margin:0;color:#fff;font-size:clamp(13px,1.65vw,18px);font-weight:650;font-style:italic;
  line-height:1.35;text-wrap:balance;
}
.value-message.initial .value-phrase{color:#ccefff;font-size:clamp(12px,1.45vw,16px);font-weight:650;font-style:normal}
.value-message.animate .value-copy{animation:valueReveal .44s cubic-bezier(.2,.75,.25,1) both}
@keyframes valueReveal{
  from{opacity:0;transform:translateY(10px)}
  to{opacity:1;transform:translateY(0)}
}
.card{
  position:relative;width:100%;height:100%;padding:0;border:0;background:transparent;cursor:pointer;perspective:1100px;
  filter:drop-shadow(0 9px 9px rgba(0,29,60,.30));
}
.inner{position:relative;width:100%;height:100%;display:block;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.4,.2,.2,1)}
.card.flipped .inner{transform:rotateY(180deg)}
.face{
  position:absolute;inset:0;display:block;overflow:hidden;border-radius:clamp(13px,1.6vw,20px);
  backface-visibility:hidden;-webkit-backface-visibility:hidden;
  border:1px solid rgba(255,255,255,.78);background:#eaf8ff;
  box-shadow:inset 0 0 0 1px rgba(0,104,168,.18),0 4px 12px rgba(0,20,50,.25);
}
.front{transform:rotateY(180deg)}
.face img{width:100%;height:100%;object-fit:cover}
.card.matched{animation:pop .36s ease}
.card.matched .face{box-shadow:0 0 0 4px rgba(98,221,255,.85),0 0 28px rgba(69,203,255,.65),0 8px 16px rgba(0,27,58,.28)}
.card:disabled{cursor:default}
@keyframes pop{0%{transform:scale(1)}45%{transform:scale(.93)}100%{transform:scale(1)}}
.overlay{
  position:absolute;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;padding:24px;background:rgba(0,26,56,.76);backdrop-filter:blur(10px)
}
.overlay[hidden]{display:none}
.modal{
  width:min(520px,92vw);padding:34px;border:1px solid rgba(255,255,255,.28);border-radius:28px;
  background:linear-gradient(155deg,rgba(4,79,133,.98),rgba(1,42,80,.99));text-align:center;box-shadow:var(--shadow)
}
.modal-logo{width:120px;height:120px;object-fit:contain;margin:0 auto 4px}
.eyebrow{margin:0 0 6px;color:#83dcff;font-size:12px;font-weight:900;letter-spacing:.16em;text-transform:uppercase}
.modal h2{margin:0 0 10px;font-size:clamp(27px,4vw,40px)}
.modal p{margin:0 0 24px;color:#d5f3ff}
.modal-actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.primary{background:linear-gradient(180deg,#fff,#cfefff);color:var(--navy);border-color:#fff}
@media(max-width:720px){
  .brand-mini strong{display:none}
  .header{grid-template-columns:50px 1fr 50px}
  .actions .label{display:none}
  .btn{padding:10px 12px}
  .stats{gap:14px}
  .stat b{font-size:19px}
  .stat span{font-size:8px}
  .play-panel{border-radius:20px}
  .value-message{min-height:74px;margin:0 8px 8px;padding:10px 12px;border-radius:14px}
  .value-title{font-size:16px}
  .value-phrase{font-size:12px}
  .value-message.initial .value-phrase{font-size:12px}
}
@media(max-height:600px){
  #game{gap:6px;padding-top:6px;padding-bottom:6px}
  .header{padding:5px 8px}
  .brand-mini img{width:38px;height:38px}
  .btn{min-height:40px;min-width:40px}
  .stat span{display:none}
  .value-message{min-height:56px;margin:0 7px 7px;padding:7px 10px}
  .value-title{margin-bottom:2px;font-size:14px}
  .value-phrase,.value-message.initial .value-phrase{font-size:11px;line-height:1.25}
}
@media(prefers-reduced-motion:reduce){
  .inner,.play,.btn{transition:none}
  .card.matched,.value-message.animate .value-copy{animation:none}
}
</style>
</head>

    ]
  };

  const VALUE_MESSAGES = Object.freeze({
    integridad: {
      title: "INTEGRIDAD",
      phrase: "Cuidar lo nuestro y respetar lo ajeno."
    },
    respeto: {
      title: "RESPETO",
      phrase: "Promover un buen ambiente de trabajo. El hostigamiento nunca es una broma."
    },
    equipo: {
      title: "JUNTOS",
      phrase: "Trabajo en equipo y cero complicidad en malas prácticas."
    },
    seguridad: {
      title: "SEGURIDAD",
      phrase: "Regresar seguros a casa cada día: reporto peligros, no me arriesgo ni a los demás."
    },
    excelencia: {
      title: "EXCELENCIA",
      phrase: "Dar lo mejor de mí y asegurar la excelencia en mi trabajo."
    }
  });

  const state = { deck:[], first:null, second:null, locked:false, moves:0, pairs:0, points:0 };
  const $ = (id) => document.getElementById(id);
  const dom = {
    menu:$("menu"), game:$("game"), board:$("board"), start:$("start"), restart:$("restart"),
    pairs:$("pairs"), moves:$("moves"), points:$("points"), win:$("win"), summary:$("summary"),
    again:$("again"), menuBtn:$("menuBtn"), valueMessage:$("valueMessage"),
    valueTitle:$("valueTitle"), valuePhrase:$("valuePhrase")
  };

  function shuffle(input) {
    const arr=[...input];
    for(let i=arr.length-1;i>0;i--) {
      const j=Math.floor(Math.random()*(i+1));
      [arr[i],arr[j]]=[arr[j],arr[i]];
    }
    return arr;
  }

  function buildDeck() {
    return shuffle(CONFIG.cards.flatMap((c,i)=>[
      {...c, uid:`${c.id}-a`, pair:`pair-${i}`},
      {...c, uid:`${c.id}-b`, pair:`pair-${i}`}
    ]));
  }

  function resetState() {
    state.deck=[]; state.first=null; state.second=null; state.locked=false;
    state.moves=0; state.pairs=0; state.points=0;
  }

  function updateStats() {
    dom.pairs.textContent=`${state.pairs}/${CONFIG.totalPairs}`;
    dom.moves.textContent=String(state.moves);
    dom.points.textContent=String(state.points);
  }

  function showValueMessage(valueId=null) {
    const value=valueId ? VALUE_MESSAGES[valueId] : null;
    dom.valueTitle.hidden=!value;
    dom.valueTitle.textContent=value ? value.title : "";
    dom.valuePhrase.textContent=value ? value.phrase : "Encuentra un par para descubrir su valor";
    dom.valueMessage.classList.toggle("initial",!value);
    dom.valueMessage.classList.remove("animate");
    void dom.valueMessage.offsetWidth;
    dom.valueMessage.classList.add("animate");
  }

  function showScreen(el) {
    [dom.menu,dom.game].forEach(s=>s.classList.remove("active"));
    el.classList.add("active");
  }

  function createCard(data) {
    const b=document.createElement("button");
    b.type="button"; b.className="card"; b.dataset.pair=data.pair; b.dataset.uid=data.uid; b.dataset.valueId=data.id;
    b.setAttribute("role","gridcell"); b.setAttribute("aria-label","Carta boca abajo");

    const inner=document.createElement("span"); inner.className="inner";
    const back=document.createElement("span"); back.className="face back";
    const backImg=document.createElement("img"); backImg.src=CONFIG.back; backImg.alt=""; back.appendChild(backImg);
    const front=document.createElement("span"); front.className="face front";
    const frontImg=document.createElement("img"); frontImg.src=data.image; frontImg.alt=data.name; front.appendChild(frontImg);
    inner.append(back,front); b.appendChild(inner);
    b.addEventListener("click",()=>pick(b));
    return b;
  }

  function render() {
    dom.board.innerHTML="";
    state.deck.forEach(c=>dom.board.appendChild(createCard(c)));
    requestAnimationFrame(fitBoard);
  }

  function fitBoard() {
    const total=state.deck.length || 10;
    const r=dom.board.getBoundingClientRect();
    const cs=getComputedStyle(dom.board);
    const padX=parseFloat(cs.paddingLeft)+parseFloat(cs.paddingRight);
    const padY=parseFloat(cs.paddingTop)+parseFloat(cs.paddingBottom);
    const gap=parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--gap")) || 12;
    const w=Math.max(0,r.width-padX), h=Math.max(0,r.height-padY);
    let best=null;
    for(let cols=1;cols<=total;cols++) {
      const rows=Math.ceil(total/cols);
      const cellW=(w-gap*(cols-1))/cols;
      const cellH=(h-gap*(rows-1))/rows;
      if(cellW<=0||cellH<=0) continue;
      const itemW=Math.min(cellW,cellH*CONFIG.cardAspectRatio,CONFIG.maxCardWidth);
      const itemH=itemW/CONFIG.cardAspectRatio;
      if(!best || itemW>best.itemW) best={cols,rows,itemW,itemH};
    }
    if(best) {
      dom.board.style.setProperty("--cols",best.cols);
      dom.board.style.setProperty("--rows",best.rows);
      dom.board.style.setProperty("--card-w",`${best.itemW}px`);
      dom.board.style.setProperty("--card-h",`${best.itemH}px`);
    }
  }

  function flip(card,on=true) {
    card.classList.toggle("flipped",on);
    card.setAttribute("aria-label",on?"Carta volteada":"Carta boca abajo");
  }

  function resetSelection() {
    state.first=null; state.second=null; state.locked=false;
  }

  function pick(card) {
    if(state.locked || card.disabled || card.classList.contains("flipped")) return;
    flip(card,true);
    if(!state.first) { state.first=card; return; }
    state.second=card; state.locked=true; state.moves++; updateStats();

    if(state.first.dataset.pair===state.second.dataset.pair) {
      state.points+=CONFIG.pointsPerMatch;
      [state.first,state.second].forEach(c=>{c.classList.add("matched");c.disabled=true;c.setAttribute("aria-label","Carta emparejada");});
      showValueMessage(state.first.dataset.valueId);
      state.pairs++; updateStats(); resetSelection();
      if(state.pairs===CONFIG.totalPairs) setTimeout(showWin,900);
    } else {
      state.points=Math.max(0,state.points-CONFIG.penaltyPerMiss); updateStats();
      setTimeout(()=>{ if(state.first) flip(state.first,false); if(state.second) flip(state.second,false); resetSelection(); },CONFIG.mismatchDelay);
    }
  }

  function startGame() {
    resetState(); state.deck=buildDeck(); updateStats(); showValueMessage(null); dom.win.hidden=true; showScreen(dom.game); render();
  }

  function showWin() {
    dom.summary.textContent=`Lo lograste en ${state.moves} movimientos y obtuviste ${state.points} puntos.`;
    dom.win.hidden=false;
  }

  function goMenu() {
    dom.win.hidden=true; state.locked=true; showScreen(dom.menu);
  }

  dom.start.addEventListener("click",startGame);
  dom.restart.addEventListener("click",startGame);
  dom.again.addEventListener("click",startGame);
  dom.menuBtn.addEventListener("click",goMenu);

  let resizeTimer;
  function onResize() {
    clearTimeout(resizeTimer);
    resizeTimer=setTimeout(()=>{if(dom.game.classList.contains("active")) fitBoard();},100);
  }
  addEventListener("resize",onResize);
  addEventListener("orientationchange",onResize);

  [CONFIG.back,...CONFIG.cards.map(c=>c.image)].forEach(src=>{const im=new Image();im.src=src;});
  updateStats();
})();
</script>
</body>
