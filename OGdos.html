<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#003f76">
<title>ORICA · Valores en acción offline</title>
<style>
:root{
  --navy:#003b70;
  --navy2:#052d59;
  --blue:#009fe3;
  --cyan:#69dcff;
  --white:#fff;
  --ice:#e7f8ff;
  --panel:rgba(255,255,255,.11);
  --line:rgba(255,255,255,.20);
  --shadow:0 28px 80px rgba(0,24,56,.36);
  --safe-top:env(safe-area-inset-top,0px);
  --safe-right:env(safe-area-inset-right,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
  --safe-left:env(safe-area-inset-left,0px);
}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden}
body{
  font-family:Inter,Segoe UI,Arial,sans-serif;color:#fff;
  background:
    radial-gradient(circle at 18% 12%,rgba(85,210,250,.42),transparent 28%),
    radial-gradient(circle at 86% 82%,rgba(0,159,227,.24),transparent 32%),
    linear-gradient(145deg,#00558f 0%,#003b70 48%,#01264b 100%);
  -webkit-tap-highlight-color:transparent;user-select:none;
}
body::before{
  content:"";position:fixed;inset:-30%;pointer-events:none;opacity:.17;
  background:repeating-radial-gradient(circle at 50% 52%,transparent 0 44px,rgba(115,222,255,.42) 45px 48px,transparent 49px 92px);
}
button{font:inherit}
[hidden]{display:none!important}

#launcher{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  padding:calc(24px + var(--safe-top)) calc(24px + var(--safe-right)) calc(24px + var(--safe-bottom)) calc(24px + var(--safe-left));
}
.launch-card{
  width:min(980px,95vw);padding:clamp(28px,4.5vw,54px);border-radius:34px;
  border:1px solid rgba(255,255,255,.22);
  background:linear-gradient(150deg,rgba(255,255,255,.16),rgba(255,255,255,.065));
  box-shadow:var(--shadow);backdrop-filter:blur(14px);text-align:center;
}
.brand{display:flex;align-items:center;justify-content:center;margin-bottom:12px}
.real-logo{width:min(320px,56vw);max-height:112px;height:auto;object-fit:contain;filter:drop-shadow(0 10px 24px rgba(0,24,56,.22))}
.kicker{margin:0 0 8px;color:#98e8ff;font-size:11px;font-weight:950;letter-spacing:.17em;text-transform:uppercase}
h1{margin:0;font-size:clamp(34px,6vw,68px);line-height:1;letter-spacing:-.035em}
.lead{width:min(660px,100%);margin:15px auto 28px;color:#d4f3ff;font-size:clamp(15px,2vw,19px);line-height:1.5}
.game-options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;max-width:820px;margin:0 auto}
.game-option{
  position:relative;min-height:230px;padding:24px 22px;border-radius:25px;border:1px solid rgba(255,255,255,.22);
  background:linear-gradient(155deg,rgba(255,255,255,.12),rgba(0,65,119,.26));
  color:#fff;cursor:pointer;text-align:left;overflow:hidden;
  transition:transform .16s ease,filter .16s ease,border-color .16s ease;
}
.game-option:hover{transform:translateY(-3px);filter:brightness(1.06);border-color:rgba(123,226,255,.62)}
.game-option:active{transform:scale(.985)}
.game-option::after{
  content:"";position:absolute;right:-46px;bottom:-74px;width:190px;height:190px;border:34px solid rgba(104,222,255,.09);border-radius:50%
}
.icon-wrap{
  width:62px;height:62px;margin-bottom:18px;display:grid;place-items:center;border-radius:18px;
  background:linear-gradient(145deg,rgba(99,221,255,.22),rgba(255,255,255,.09));
  border:1px solid rgba(255,255,255,.18)
}
.icon-wrap svg{width:34px;height:34px;stroke:#fff;stroke-width:1.9;fill:none;stroke-linecap:round;stroke-linejoin:round}
.game-option h2{margin:0 0 8px;font-size:clamp(23px,3vw,34px);letter-spacing:-.02em}
.game-option p{margin:0;color:#cfefff;font-size:14px;line-height:1.42;max-width:320px}
.play-label{
  display:inline-flex;align-items:center;gap:7px;margin-top:19px;padding:8px 12px;border-radius:999px;
  background:rgba(255,255,255,.11);border:1px solid rgba(255,255,255,.16);
  font-size:11px;font-weight:950;letter-spacing:.08em;text-transform:uppercase
}

#gameShell{position:absolute;inset:0;display:flex;flex-direction:column;background:#003b70}
.gamebar{
  position:relative;z-index:5;flex:0 0 auto;min-height:58px;
  display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;
  padding:calc(7px + var(--safe-top)) calc(10px + var(--safe-right)) 7px calc(10px + var(--safe-left));
  border-bottom:1px solid rgba(255,255,255,.15);
  background:linear-gradient(180deg,rgba(0,50,95,.98),rgba(0,41,80,.96));
  box-shadow:0 9px 24px rgba(0,19,44,.22)
}
.mini-brand{display:flex;align-items:center}
.mini-logo{width:116px;max-width:20vw;height:34px;object-fit:contain;object-position:left center}
.current-game{text-align:center;font-size:12px;font-weight:950;letter-spacing:.12em;text-transform:uppercase;color:#bdeeff}
.gamebar-actions{justify-self:end;display:flex;gap:7px}
.shell-btn{
  min-height:40px;padding:8px 14px;border-radius:999px;border:1px solid rgba(255,255,255,.22);
  background:rgba(255,255,255,.10);color:#fff;font-weight:900;cursor:pointer
}
.shell-btn:hover{background:rgba(255,255,255,.16)}
.shell-btn.primary{background:linear-gradient(180deg,#fff,#dff7ff);color:var(--navy);border-color:#fff}
#gameFrame{flex:1 1 auto;width:100%;min-height:0;border:0;background:#003b70}

@media(max-width:700px){
  #launcher{align-items:flex-start;overflow-y:auto;padding:8px}
  .launch-card{width:100%;padding:16px 12px;border-radius:22px;margin:auto 0}
  .real-logo{width:min(220px,68vw);max-height:76px}
  .kicker{font-size:9px;margin-bottom:5px}
  h1{font-size:clamp(32px,11vw,44px);line-height:.98}
  .lead{margin:10px auto 14px;font-size:13px;line-height:1.35}
  .game-options{grid-template-columns:1fr;gap:8px}
  .game-option{min-height:0;padding:13px 14px;border-radius:19px}
  .icon-wrap{width:42px;height:42px;margin-bottom:8px;border-radius:12px}
  .icon-wrap svg{width:24px;height:24px}
  .game-option h2{font-size:21px;margin-bottom:5px}
  .game-option p{font-size:11.5px;line-height:1.3}
  .play-label{margin-top:9px;padding:6px 10px;font-size:9px}
  .gamebar{
    grid-template-columns:auto 1fr auto;min-height:44px;
    padding:calc(3px + var(--safe-top)) 6px 3px;
  }
  .mini-logo{width:68px;height:23px}
  .current-game{font-size:8px;letter-spacing:.07em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .shell-btn{min-height:32px;padding:5px 8px;font-size:10px}
  #restartGame{display:none}
}
@media(max-width:420px) and (max-height:650px){
  #launcher{padding:5px}
  .launch-card{padding:10px;border-radius:18px}
  .real-logo{width:min(185px,62vw);max-height:58px}
  .kicker{font-size:8px;margin-bottom:3px}
  h1{font-size:32px}
  .lead{margin:7px auto 9px;font-size:11.5px;line-height:1.25}
  .game-options{gap:6px}
  .game-option{padding:10px 12px;border-radius:16px}
  .icon-wrap{width:36px;height:36px;margin-bottom:6px}
  .icon-wrap svg{width:21px;height:21px}
  .game-option h2{font-size:18px}
  .game-option p{font-size:10.5px}
  .play-label{margin-top:7px;padding:5px 9px;font-size:8px}
}
@media(max-height:620px) and (min-width:701px){
  .launch-card{padding:25px 36px}
  .lead{margin:9px auto 17px}
  .game-option{min-height:175px;padding:18px}
  .icon-wrap{width:48px;height:48px;margin-bottom:10px}
  .play-label{margin-top:10px}
}

/* Perfil vertical: pensado para tótem 9:16 y móviles altos */
body.portrait-layout #launcher{
  align-items:center;justify-content:center;overflow:hidden;
  padding:clamp(10px,1.8vh,28px) clamp(10px,3vw,34px);
}
body.portrait-layout .launch-card{
  width:min(900px,94vw);height:min(92dvh,1760px);max-height:calc(100dvh - 18px);
  display:flex;flex-direction:column;
  padding:clamp(22px,2.8vh,42px) clamp(20px,4vw,42px);
  border-radius:clamp(22px,3vw,32px);
}
body.portrait-layout .real-logo{
  width:min(390px,66vw);max-height:clamp(82px,11vh,130px);
}
body.portrait-layout .kicker{margin-bottom:6px;font-size:clamp(11px,1.8vw,14px)}
body.portrait-layout h1{font-size:clamp(48px,9vw,72px);line-height:.98}
body.portrait-layout .lead{
  max-width:660px;margin:clamp(10px,1.5vh,18px) auto clamp(12px,1.9vh,22px);
  font-size:clamp(15px,2.6vw,19px);line-height:1.38;
}
body.portrait-layout .game-options{
  flex:1 1 auto;width:100%;grid-template-columns:1fr;grid-template-rows:repeat(2,minmax(0,1fr));
  gap:clamp(14px,1.8vh,22px);max-width:760px;margin-top:clamp(6px,1vh,12px);
}
body.portrait-layout .game-option{
  min-height:0;padding:clamp(22px,2.8vh,36px) clamp(22px,4vw,34px);
  border-radius:clamp(20px,3vw,28px);
}
body.portrait-layout .icon-wrap{
  width:clamp(58px,7.5vh,82px);height:clamp(58px,7.5vh,82px);
  margin-bottom:clamp(12px,1.4vh,18px);border-radius:18px;
}
body.portrait-layout .game-option h2{font-size:clamp(31px,5.2vw,42px);margin-bottom:10px}
body.portrait-layout .game-option p{font-size:clamp(18px,3vw,23px);line-height:1.38}
body.portrait-layout .play-label{
  margin-top:clamp(14px,1.7vh,20px);padding:11px 16px;font-size:clamp(14px,2.2vw,17px);
}
body.portrait-layout .gamebar{
  min-height:clamp(42px,5.4vh,58px);
  padding:calc(4px + var(--safe-top)) clamp(6px,1.6vw,12px) 4px;
}
body.portrait-layout .mini-logo{width:clamp(68px,16vw,118px);height:30px}
body.portrait-layout .current-game{font-size:clamp(11px,2vw,14px)}
body.portrait-layout .shell-btn{min-height:38px;padding:7px clamp(10px,2vw,16px);font-size:clamp(11px,1.9vw,13px)}
body.portrait-layout #restartGame{display:none}
@media(prefers-reduced-motion:reduce){
  .game-option{transition:none}
}

.offline-status{position:fixed;right:max(10px,var(--safe-right));bottom:max(10px,var(--safe-bottom));z-index:20;max-width:min(360px,calc(100vw - 20px));padding:8px 11px;border-radius:999px;border:1px solid rgba(255,255,255,.22);background:rgba(0,36,72,.72);color:#dbf8ff;font-size:11px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;box-shadow:0 10px 24px rgba(0,18,42,.18);pointer-events:none}
.offline-status.ready{background:rgba(9,117,70,.86);color:#fff}
.offline-status.error{background:rgba(160,38,55,.88);color:#fff}
body.portrait-layout .offline-status{font-size:clamp(10px,1.7vw,13px);padding:8px 10px}

</style>
</head>
<body>
<section id="launcher" aria-label="Selector de juegos">
  <div class="launch-card">
    <div class="brand"><img class="real-logo" src="ORICALOGO.png" alt="ORICA"></div>
    <p class="kicker">Valores en acción · offline</p>
    <h1>¿A qué quieres jugar?</h1>
    <p class="lead">Dos experiencias rápidas para descubrir, reconocer y poner en práctica los valores ORICA.</p>

    <div class="game-options">
      <button class="game-option" type="button" data-game="memory">
        <span class="icon-wrap" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <rect x="3" y="4" width="8" height="10" rx="2"></rect>
            <rect x="13" y="10" width="8" height="10" rx="2"></rect>
            <path d="M7 8h.01M17 14h.01"></path>
          </svg>
        </span>
        <h2>Memoria de valores</h2>
        <p>Encuentra las parejas y descubre ejemplos de cada valor.</p>
        <span class="play-label">Jugar memoria →</span>
      </button>

      <button class="game-option" type="button" data-game="challenge">
        <span class="icon-wrap" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <path d="M12 3a9 9 0 1 0 9 9"></path>
            <path d="M12 7v5l3 2"></path>
            <path d="m16.5 4.5 1.3 1.3L21 2.6"></path>
          </svg>
        </span>
        <h2>Reto de valores</h2>
        <p>Analiza situaciones y decide si representan una conducta esperada.</p>
        <span class="play-label">Aceptar el reto →</span>
      </button>
    </div>
  </div>
</section>

<section id="gameShell" hidden aria-label="Juego seleccionado">
  <header class="gamebar">
    <div class="mini-brand"><img class="mini-logo" src="ORICALOGO.png" alt="ORICA"></div>
    <div id="currentGame" class="current-game">Memoria de valores</div>
    <div class="gamebar-actions">
      <button id="restartGame" class="shell-btn" type="button">↻ Reiniciar</button>
      <button id="chooseGame" class="shell-btn primary" type="button">Elegir juego</button>
    </div>
  </header>
  <iframe id="gameFrame" title="Juego ORICA" allow="fullscreen" loading="eager"></iframe>
</section>

<div id="offlineStatus" class="offline-status">Preparando offline...</div>

<script>
(function(){
  "use strict";

  var launcher=document.getElementById("launcher");
  var shell=document.getElementById("gameShell");
  var frame=document.getElementById("gameFrame");
  var currentGame=document.getElementById("currentGame");
  var chooseGame=document.getElementById("chooseGame");
  var restartGame=document.getElementById("restartGame");

  var games={
    memory:{label:"Memoria de valores",src:"orica-dos.html?hub=1"},
    challenge:{label:"Reto de valores",src:"RCOdos.html?hub=1"}
  };

  var activeGame=null;

  function applyLayoutProfile(){
    var portrait=window.innerHeight>window.innerWidth;
    var ratio=window.innerHeight/Math.max(window.innerWidth,1);
    document.body.classList.toggle("portrait-layout",portrait && ratio>1.35);
  }
  applyLayoutProfile();
  window.addEventListener("resize",applyLayoutProfile);
  window.addEventListener("orientationchange",applyLayoutProfile);

  function openGame(key){
    var game=games[key];
    if(!game) return;
    activeGame=key;
    currentGame.textContent=game.label;
    launcher.hidden=true;
    shell.hidden=false;
    frame.src=game.src;
  }

  function backToGames(){
    activeGame=null;
    frame.src="about:blank";
    shell.hidden=true;
    launcher.hidden=false;
  }

  function restart(){
    if(!activeGame) return;
    frame.src=games[activeGame].src;
  }

  document.querySelectorAll("[data-game]").forEach(function(btn){
    btn.addEventListener("click",function(){openGame(btn.dataset.game);});
  });

  chooseGame.addEventListener("click",backToGames);
  restartGame.addEventListener("click",restart);

  window.addEventListener("message",function(e){
    if(e && e.data && e.data.type==="ORICA_CHOOSE_GAME") backToGames();
  });

  document.addEventListener("keydown",function(e){
    if(e.key==="Escape" && !shell.hidden) backToGames();
  });

  var offlineStatus=document.getElementById("offlineStatus");
  function setOfflineStatus(text,cls){
    if(!offlineStatus) return;
    offlineStatus.textContent=text;
    offlineStatus.classList.remove("ready","error");
    if(cls) offlineStatus.classList.add(cls);
  }
  function registerOfflineCache(){
    if(location.protocol==="file:") { setOfflineStatus("Modo local listo","ready"); return; }
    if(!("serviceWorker" in navigator)) { setOfflineStatus("Sin cache automatica","error"); return; }
    navigator.serviceWorker.register("./ogdos-sw.js").then(function(){
      return navigator.serviceWorker.ready;
    }).then(function(reg){
      setOfflineStatus("Guardando archivos...");
      var worker=reg.active || reg.waiting || reg.installing;
      if(worker) worker.postMessage({type:"CACHE_NOW"});
      setTimeout(function(){ setOfflineStatus("Offline listo","ready"); },1800);
    }).catch(function(){
      setOfflineStatus("Revisar cache offline","error");
    });
  }
  if("serviceWorker" in navigator) {
    navigator.serviceWorker.addEventListener("message",function(event){
      if(event.data && event.data.type==="CACHE_DONE") setOfflineStatus("Offline listo","ready");
      if(event.data && event.data.type==="CACHE_ERROR") setOfflineStatus("Falta precargar","error");
    });
  }
  registerOfflineCache();
})();
</script>
</body>
</html>
