<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Trivia ALAFARPE · 73 Años</title>
<style>
  /* Roboto vía Google Fonts (si el tótem tiene internet). Si no hay conexión,
     cae automáticamente a 'Segoe UI' que ya viene instalada en Windows. */
  @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap');

  :root{
    /* ---- Paleta (tomada del arte de 73 años ALAFARPE) ---- */
    --c-night:      #010409;   /* negro casi puro, arranque del degradado */
    --c-navy:       #0a1a3f;   /* azul noche, punto medio */
    --c-electric:   #2f6fe4;   /* celeste eléctrico, base del degradado */
    --c-electric-2: #4f8ff0;   /* celeste más claro, brillos */
    --c-red:        #e8231c;   /* rojo institucional (73 / CONECTADOS) */
    --c-red-soft:   #d1453d;   /* relleno suave del botón */
    --c-red-deep:   #7a120d;   /* sombra del botón */
    --c-neon:       #ff2d20;   /* rojo neón (glow) */
    --c-correct:    #2ecc71;
    --c-incorrect:  #ef4444;
    --c-card:       rgba(255,255,255,.08);
    --c-card-brd:   rgba(255,255,255,.22);
    --font-display: 'Impact','Anton','Haettenschweiler','Arial Narrow Bold',sans-serif;
    --font-body:    'Roboto','Segoe UI',Arial,Helvetica,sans-serif;
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{
    height:100%; height:100vh; height:100dvh; margin:0; padding:0; overflow:hidden;
    overscroll-behavior:none; touch-action:manipulation;
    -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
  }
  body{
    font-family:var(--font-body);
    background:linear-gradient(180deg, var(--c-night) 0%, var(--c-navy) 55%, var(--c-electric) 100%);
    color:#fff;
  }
  img{ -webkit-user-drag:none; }
  button{ font-family:inherit; -webkit-user-select:none; user-select:none; }

  .app-shell{
    position:relative; max-width:560px; margin:0 auto; height:100vh; height:100dvh;
    padding-top:env(safe-area-inset-top); padding-bottom:env(safe-area-inset-bottom);
  }

  .screen{
    position:absolute; top:0; right:0; bottom:0; left:0; display:flex; flex-direction:column; align-items:center;
    opacity:1; transform:translateY(0); transition:opacity .45s ease, transform .45s ease;
  }
  .screen.hidden{ opacity:0; transform:translateY(14px); pointer-events:none; }

  /* ============ PANTALLA DE INICIO ============ */
  #start-screen{ justify-content:center; gap:clamp(22px,4.5vh,44px); padding:clamp(18px,5vh,40px) clamp(18px,6vw,32px); text-align:center; }

  .start-top{ display:flex; flex-direction:column; align-items:center; gap:clamp(10px,2.4vh,18px); width:100%; }

  .logo-wrap{ width:100%; display:flex; justify-content:center; }
  .logo-wrap img{ max-width:min(58vw,240px); height:auto; display:block; }
  .logo-fallback{
    display:none; align-items:center; gap:10px; padding:10px 18px; border:2px dashed rgba(255,255,255,.35);
    border-radius:14px; font-family:var(--font-display); letter-spacing:1px; font-size:clamp(1.1rem,4.5vw,1.5rem);
  }
  .logo-fallback .lf-mark{ color:var(--c-red); font-size:1.3em; }

  .kicker{
    margin:0; font-weight:700; font-size:clamp(1.05rem,4.6vw,1.45rem); line-height:1.3;
    color:#fff; opacity:.95; max-width:22ch;
  }

  .start-mid{ display:flex; flex-direction:column; align-items:center; gap:clamp(14px,3vh,22px); }

  .btn-iniciar{
    position:relative; border:3px solid var(--c-neon); cursor:pointer;
    background:linear-gradient(145deg, var(--c-red-soft), var(--c-red-deep));
    color:#fff; font-family:var(--font-display); font-weight:400; letter-spacing:3px;
    font-size:clamp(1.6rem,7vw,2.5rem); padding:clamp(16px,3.6vh,24px) clamp(46px,13vw,84px);
    border-radius:999px; text-transform:uppercase;
    box-shadow:0 0 14px 2px rgba(255,45,32,.6), 0 0 42px 8px rgba(255,45,32,.28), inset 0 0 14px rgba(255,255,255,.10);
    animation:pulseGlow 2.2s ease-in-out infinite alternate;
    transition:transform .15s ease;
  }
  .btn-iniciar:active{ transform:scale(.95); }
  @keyframes pulseGlow{
    from{ box-shadow:0 0 14px 2px rgba(255,45,32,.55), 0 0 34px 6px rgba(255,45,32,.22), inset 0 0 14px rgba(255,255,255,.10); }
    to  { box-shadow:0 0 22px 5px rgba(255,45,32,.85), 0 0 56px 14px rgba(255,45,32,.4), inset 0 0 14px rgba(255,255,255,.14); }
  }

  .motto-wrap{ display:flex; justify-content:center; width:100%; }
  .motto-wrap img{ max-width:min(72vw,320px); height:auto; display:block; }
  .motto-fallback{
    display:none; flex-direction:column; align-items:center; line-height:.85;
    font-family:var(--font-display);
  }
  .mf-73{ display:flex; }
  .mf-7{ color:var(--c-electric-2); font-size:clamp(3.6rem,16vw,6.2rem); }
  .mf-3{ color:var(--c-red); font-size:clamp(3.6rem,16vw,6.2rem); margin-left:-.12em; }
  .mf-anios{ font-size:clamp(.85rem,3vw,1.1rem); letter-spacing:4px; color:#fff; opacity:.85; margin-top:2px; }

  .start-bottom{ width:100%; display:flex; justify-content:center; }

  .scoreboard{
    width:100%; max-width:340px; background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.16);
    border-radius:16px; padding:12px 16px; backdrop-filter:blur(6px); text-align:left;
  }
  .scoreboard.hidden{ display:none; }
  .sb-title{ margin:0 0 8px; font-weight:700; font-size:.95rem; text-align:center; opacity:.9; }
  .sb-row{ display:flex; align-items:center; gap:10px; font-size:.9rem; padding:4px 0; border-top:1px solid rgba(255,255,255,.08); }
  .sb-row:first-of-type{ border-top:none; }
  .sb-rank{ width:1.6em; font-weight:700; }
  .sb-score{ flex:1; font-weight:700; }
  .sb-detail{ opacity:.7; font-size:.82em; }

  /* ============ PANTALLA DE QUIZ ============ */
  #quiz-screen{ justify-content:flex-start; padding:clamp(14px,3vh,26px) clamp(16px,5vw,28px); gap:clamp(10px,2vh,18px); }

  .quiz-top{ width:100%; display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .chip{
    font-weight:700; font-size:.78rem; letter-spacing:.5px; padding:6px 14px; border-radius:999px;
    background:var(--c-electric); color:#fff; white-space:nowrap;
  }
  .chip-alafarpe{ background:linear-gradient(135deg,#2f6fe4,#1c3f7a); }
  .chip-fihu{ background:linear-gradient(135deg,#1fb08a,#0d6b53); }
  .chip-salud{ background:linear-gradient(135deg,#e8231c,#8f130d); }
  .q-counter{ font-weight:700; font-size:.9rem; opacity:.85; }
  .live-score{ position:relative; font-weight:900; font-size:1rem; background:rgba(255,255,255,.1); padding:6px 12px; border-radius:999px; }
  .score-pop{
    position:absolute; right:6px; top:-6px; font-weight:900; color:var(--c-correct); font-size:.95rem;
    animation:floatUp .9s ease-out forwards; pointer-events:none;
  }
  @keyframes floatUp{ 0%{ opacity:1; transform:translateY(0); } 100%{ opacity:0; transform:translateY(-28px); } }

  .timer-track{ width:100%; height:9px; border-radius:999px; background:rgba(255,255,255,.15); overflow:hidden; }
  .timer-fill{ height:100%; width:100%; background:linear-gradient(90deg,var(--c-electric-2),var(--c-electric)); border-radius:999px; }
  .timer-fill.low{ background:linear-gradient(90deg,#ff6a5e,var(--c-incorrect)); }

  .question-card{ width:100%; flex:0 0 auto; opacity:0; transform:translateY(10px); }
  .question-card.enter{ animation:qEnter .4s ease forwards; }
  @keyframes qEnter{ to{ opacity:1; transform:translateY(0); } }

  .question-text{
    margin:clamp(6px,1.6vh,14px) 0; font-weight:700; font-size:clamp(1.15rem,5.4vw,1.7rem);
    line-height:1.35; text-align:center;
  }

  .options{ width:100%; display:flex; flex-direction:column; gap:clamp(10px,1.8vh,16px); }
  .option{
    display:flex; align-items:center; gap:14px; width:100%; min-height:78px; padding:12px 18px;
    border-radius:18px; border:2px solid var(--c-card-brd); cursor:pointer; text-align:left;
    background:linear-gradient(135deg,#20458c,#183a78);
    color:#fff; font-size:clamp(1rem,4.2vw,1.2rem); font-weight:500;
    transition:background .35s ease, border-color .35s ease, transform .25s ease, opacity .35s ease, filter .35s ease;
  }
  .option:active{ transform:scale(.98); }
  .opt-letter{
    flex:0 0 auto; width:34px; height:34px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    background:rgba(255,255,255,.16); font-family:var(--font-display); font-size:1.1rem;
  }
  .opt-text{ flex:1; }
  .option.locked{ pointer-events:none; }
  .option.correct{
    background:linear-gradient(135deg,#33d374,#1c9c56); border-color:var(--c-correct);
    box-shadow:0 0 18px 2px rgba(46,204,113,.5);
  }
  .option.incorrect{
    background:linear-gradient(135deg,#f0564c,#b91c1c); border-color:var(--c-incorrect);
    box-shadow:0 0 18px 2px rgba(239,68,68,.5);
    animation:shakeX .4s ease;
  }
  .option.dim{ opacity:.35; filter:grayscale(.5); }
  @keyframes shakeX{
    0%,100%{ transform:translateX(0); } 25%{ transform:translateX(-6px); } 75%{ transform:translateX(6px); }
  }

  /* ============ PANTALLA FINAL (overlay flotante) ============ */
  .overlay{
    position:fixed; top:0; right:0; bottom:0; left:0; z-index:50; display:flex; align-items:center; justify-content:center;
    background:rgba(2,6,20,.82); backdrop-filter:blur(8px); opacity:1; transition:opacity .4s ease;
    padding:24px;
  }
  .overlay.hidden{ opacity:0; pointer-events:none; }
  .end-card{
    width:100%; max-width:380px; text-align:center; padding:clamp(24px,5vh,36px) clamp(20px,6vw,32px);
    border-radius:28px; border:1px solid rgba(255,255,255,.18);
    background:linear-gradient(160deg, rgba(12,24,58,.96), rgba(24,48,104,.96));
    box-shadow:0 24px 70px rgba(0,0,0,.55);
    animation:popIn .45s cubic-bezier(.2,1.4,.4,1);
  }
  @keyframes popIn{ from{ opacity:0; transform:scale(.82); } to{ opacity:1; transform:scale(1); } }
  .end-title{ margin:0 0 4px; font-weight:700; font-size:1.15rem; opacity:.9; }
  .end-score{
    margin:6px 0 0; font-family:var(--font-display); font-size:clamp(3.2rem,15vw,4.6rem); line-height:1;
    color:#fff; text-shadow:0 0 24px rgba(255,45,32,.55);
  }
  .end-score-label{ margin:0 0 10px; font-size:.85rem; letter-spacing:3px; opacity:.7; }
  .end-correct{ margin:0 0 10px; font-weight:700; font-size:1rem; opacity:.9; }
  .end-tier{
    display:inline-block; margin:0 0 20px; padding:6px 16px; border-radius:999px; font-weight:700; font-size:.9rem;
  }
  .tier-1{ background:rgba(46,204,113,.2); color:#4ee38a; border:1px solid rgba(46,204,113,.5); }
  .tier-2{ background:rgba(79,143,240,.2); color:#7fb0ff; border:1px solid rgba(79,143,240,.5); }
  .tier-3{ background:rgba(255,193,7,.2); color:#ffd35c; border:1px solid rgba(255,193,7,.5); }
  .tier-4{ background:rgba(239,68,68,.2); color:#ff8a8a; border:1px solid rgba(239,68,68,.5); }

  .countdown-wrap{ position:relative; width:56px; height:56px; margin:0 auto 8px; }
  .countdown-ring{ transform:rotate(-90deg); }
  .countdown-ring circle{ fill:none; stroke-width:4; }
  .ring-bg{ stroke:rgba(255,255,255,.15); }
  .ring-fg{ stroke:var(--c-electric-2); stroke-linecap:round; }
  #countdown-num{
    position:absolute; top:0; right:0; bottom:0; left:0; display:flex; align-items:center; justify-content:center;
    font-weight:900; font-size:1.05rem;
  }
  .end-hint{ margin:0; font-size:.8rem; opacity:.55; }

  @media (prefers-reduced-motion: reduce){
    .btn-iniciar{ animation:none; }
    .option.incorrect{ animation:none; }
    .end-card{ animation:none; }
    .question-card.enter{ animation:none; opacity:1; transform:none; }
  }
</style>
</head>
<body>

<div class="app-shell">

  <!-- ============ PANTALLA DE INICIO ============ -->
  <section id="start-screen" class="screen">
    <div class="start-top">
      <div class="logo-wrap">
        <!-- Reemplazar logotipo.webp por el archivo real del logo ALAFARPE (misma carpeta que este HTML) -->
        <img id="logo-img" src="logotipo.webp" alt="ALAFARPE"
             onerror="this.style.display='none'; document.getElementById('logo-fallback').style.display='flex';">
        <div id="logo-fallback" class="logo-fallback">
          <span class="lf-mark">✚</span><span class="lf-text">ALAFARPE</span>
        </div>
      </div>
      <p class="kicker">¿Cuánto sabes de ALAFARPE, FIHU y el sector Salud?</p>
    </div>

    <div class="start-mid">
      <button id="btn-iniciar" class="btn-iniciar">Iniciar</button>
      <div class="motto-wrap">
        <!-- Reemplazar motto.png por la imagen real de "73 años" (misma carpeta que este HTML) -->
        <img id="motto-img" src="motto.png" alt="73 años"
             onerror="this.style.display='none'; document.getElementById('motto-fallback').style.display='flex';">
        <div id="motto-fallback" class="motto-fallback">
          <span class="mf-73"><span class="mf-7">7</span><span class="mf-3">3</span></span>
          <span class="mf-anios">AÑOS</span>
        </div>
      </div>
    </div>

    <div class="start-bottom">
      <div id="scoreboard" class="scoreboard hidden"></div>
    </div>
  </section>

  <!-- ============ PANTALLA DE QUIZ ============ -->
  <section id="quiz-screen" class="screen hidden">
    <div class="quiz-top">
      <span id="cat-chip" class="chip">ALAFARPE</span>
      <span id="q-counter" class="q-counter">1 / 10</span>
      <span id="live-score" class="live-score">⭐ 0</span>
    </div>
    <div class="timer-track"><div id="timer-fill" class="timer-fill"></div></div>
    <div id="question-card" class="question-card">
      <h2 id="question-text" class="question-text"></h2>
    </div>
    <div id="options" class="options"></div>
  </section>

</div>

<!-- ============ OVERLAY FINAL (flotante, oscurece el fondo) ============ -->
<div id="end-overlay" class="overlay hidden">
  <div id="end-card" class="end-card">
    <p class="end-title">¡Juego terminado!</p>
    <p id="end-score" class="end-score">0</p>
    <p class="end-score-label">PUNTOS</p>
    <p id="end-correct" class="end-correct">0/10 correctas</p>
    <span id="end-tier" class="end-tier">—</span>
    <div class="countdown-wrap">
      <svg class="countdown-ring" width="56" height="56" viewBox="0 0 56 56">
        <circle class="ring-bg" cx="28" cy="28" r="24"></circle>
        <circle id="ring-fg" class="ring-fg" cx="28" cy="28" r="24"></circle>
      </svg>
      <span id="countdown-num">5</span>
    </div>
    <p class="end-hint">Toca para continuar</p>
  </div>
</div>

<script>
(function(){
  "use strict";

  /* =====================================================================
     CONFIGURACIÓN — ajusta estos números para cambiar el comportamiento
     ===================================================================== */
  const CONFIG = {
    QUESTIONS_PER_GAME: 10,   // hay 21 preguntas en total; pon 21 para usarlas todas
    TIME_PER_QUESTION: 15,    // segundos por pregunta
    BASE_POINTS: 100,         // puntos fijos por acertar
    MAX_SPEED_BONUS: 100,     // puntos extra si se responde al instante (baja linealmente a 0)
    FEEDBACK_DELAY: 1300,     // ms que se muestran los colores antes de pasar a la siguiente
    END_AUTO_RETURN: 5000,    // ms antes de volver sola al inicio
    MAX_SCOREBOARD: 5,        // cuántos puntajes se guardan en el marcador
  };

  const STORAGE_KEY = 'alafarpe_trivia_scores_v1';

  /* =====================================================================
     BANCO DE PREGUNTAS — extraídas del PDF "Preguntas - evento embajadas".
     Las respuestas correctas vienen de las opciones marcadas en NEGRITA
     en el documento original.
     NOTA: en 2 preguntas ninguna opción venía en negrita en el PDF
     (marcadas abajo con "// revisar"); se completaron con la opción más
     razonable — conviene que alguien de ALAFARPE las confirme.
     ===================================================================== */
  const QUESTION_BANK = [
    // ---- ALAFARPE ----
    { category:'ALAFARPE', q:'¿En qué año se creó ALAFARPE?',
      options:['1943','1953','1963','1973'], correct:1 },
    { category:'ALAFARPE', q:'¿Cuántas personas forman parte de la comunidad ALAFARPE?',
      options:['Entre 50 y 100','Entre 100 y 200','Entre 200 y 300','Más de 500'], correct:2 },
    { category:'ALAFARPE', q:'¿Cuáles son los pilares de ALAFARPE?',
      options:['Acceso oportuno, calidad y sostenibilidad y ética','Innovación, competitividad y exportación','Prevención, diagnóstico y tratamiento','Investigación, producción y distribución'], correct:0 },
    { category:'ALAFARPE', q:'¿Cuántos presidentes ha tenido ALAFARPE?',
      options:['12','19','27','40'], correct:2 },
    { category:'ALAFARPE', q:'¿Cuándo se realizó el primer CADE Salud?',
      options:['2019','2022','2025','2026'], correct:2 },
    { category:'ALAFARPE', q:'¿A qué comunidades pertenece ALAFARPE?', // revisar: ninguna opción en negrita en el PDF
      options:['Pacto Global de las Naciones Unidas','Marco Consensuado de Ética de APEC','Gremios: IFPMA, FIFARMA, CONFIEP, IPAE','Todas las anteriores'], correct:3 },

    // ---- FIHU ----
    { category:'FIHU', q:'¿Qué personaje histórico peruano da nombre a la Fundación?',
      options:['Daniel Alcides Carrión','Cayetano Heredia','Hipólito Unanue','Honorio Delgado'], correct:2 },
    { category:'FIHU', q:'¿En qué áreas de las Ciencias de la Salud se enfoca principalmente la FIHU?',
      options:['Medicina','Odontología','Farmacia y Bioquímica','Todas las anteriores'], correct:3 },
    { category:'FIHU', q:'¿Cómo se llama el programa de la FIHU que brinda apoyo económico a estudiantes destacados de Ciencias de la Salud?',
      options:['Premio Hipólito Unanue','Becas de Honor FIHU','Fondo de Excelencia Médica','Becas ALAFARPE Salud'], correct:1 },
    { category:'FIHU', q:'¿Cuál de estos reconocimientos es otorgado por la FIHU?',
      options:['Medalla de Oro','Premio a los Mejores Trabajos de Investigación','Premio a la Mejor Edición Científica','Todas las anteriores'], correct:3 },
    { category:'FIHU', q:'¿Cómo se llama la revista científica vinculada a la FIHU?',
      options:['Revista Peruana de Salud','Ciencia Médica','Diagnóstico','Hipólito Unanue'], correct:2 },
    { category:'FIHU', q:'¿Cuántos alumnis tiene el Programa Becas de Honor?',
      options:['Más de 100','Más de 500','Más de 1,000','Más de 5,000'], correct:2 },

    // ---- SALUD ----
    { category:'SALUD', q:'¿Qué porcentaje del presupuesto público del Perú se destina al sector Salud?',
      options:['5%','8%','13%','20%'], correct:2 },
    { category:'SALUD', q:'¿Desde qué año las Enfermedades Raras y Huérfanas (ERH) cuentan con un presupuesto específico en el Perú?',
      options:['2011','2019','2022','2025'], correct:3 },
    { category:'SALUD', q:'¿Cuál de los siguientes SÍ es un dispositivo médico?',
      options:['Jeringa','Marcapasos','Prótesis de cadera','Todas las anteriores'], correct:3 },
    { category:'SALUD', q:'¿Qué significan las siglas MDA en el sector salud?',
      options:['Mecanismos de Diagnóstico Avanzado','Mecanismo Diferenciados de Adquisición','Medicamentos de Acceso Directo','Modelos de Distribución Asistencial'], correct:1 },
    { category:'SALUD', q:'¿En qué año se promulgó la Ley Nacional del Cáncer?',
      options:['2015','2018','2021','2024'], correct:2 },
    { category:'SALUD', q:'¿Qué entidad otorga el registro sanitario a medicamentos y dispositivos médicos en el Perú?',
      options:['SUSALUD','DIGEMID','INDECOPI','EsSalud'], correct:1 },
    { category:'SALUD', q:'¿Cuántas enfermedades raras se han identificado en el mundo?',
      options:['Más de 70','Más de 700','Más de 7,000','Más de 70,000'], correct:2 },
    { category:'SALUD', q:'¿Cuánto retorna a la economía cada dólar invertido en vacunación?', // revisar: ninguna opción en negrita en el PDF (verificado por fuera: la cifra citada por la OMS/OHE es "19 veces")
      options:['3 veces','8 veces','10 veces','19 veces'], correct:3 },
    { category:'SALUD', q:'¿Cuántas vacunas incluye el esquema nacional de vacunación del Perú?',
      options:['8','12','23','25'], correct:2 },
  ];

  /* =====================================================================
     ESTADO DEL JUEGO
     ===================================================================== */
  let currentGameQuestions = [];
  let currentIndex = 0;
  let score = 0;
  let correctCount = 0;
  let maxPossibleScore = 0;
  let answered = false;
  let timeLeft = CONFIG.TIME_PER_QUESTION;
  let timerInterval = null;
  let endReturnTimeout = null;
  let endCountdownInterval = null;
  let optionEls = [];
  let scoreboard = [];

  const CIRC = 2 * Math.PI * 24; // circunferencia del anillo de cuenta regresiva (r=24)

  /* =====================================================================
     REFERENCIAS DOM
     ===================================================================== */
  const startScreen   = document.getElementById('start-screen');
  const quizScreen    = document.getElementById('quiz-screen');
  const btnIniciar    = document.getElementById('btn-iniciar');
  const scoreboardEl  = document.getElementById('scoreboard');

  const catChip       = document.getElementById('cat-chip');
  const qCounter      = document.getElementById('q-counter');
  const liveScoreEl   = document.getElementById('live-score');
  const timerFillEl   = document.getElementById('timer-fill');
  const questionCard  = document.getElementById('question-card');
  const questionText  = document.getElementById('question-text');
  const optionsWrap   = document.getElementById('options');

  const endOverlay    = document.getElementById('end-overlay');
  const endCard       = document.getElementById('end-card');
  const endScoreEl    = document.getElementById('end-score');
  const endCorrectEl  = document.getElementById('end-correct');
  const endTierEl     = document.getElementById('end-tier');
  const ringFg        = document.getElementById('ring-fg');
  const countdownNum  = document.getElementById('countdown-num');

  ringFg.style.strokeDasharray = String(CIRC);

  /* =====================================================================
     UTILIDADES
     ===================================================================== */
  function shuffle(arr){
    for(let i = arr.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  // Baraja también el orden de las opciones dentro de cada pregunta
  function prepareQuestion(q){
    const order = shuffle([0,1,2,3]);
    return {
      category: q.category,
      q: q.q,
      options: order.map(i => q.options[i]),
      correct: order.indexOf(q.correct),
    };
  }

  function showScreen(name){
    startScreen.classList.toggle('hidden', name !== 'start');
    quizScreen.classList.toggle('hidden', name !== 'quiz');
  }

  /* =====================================================================
     MARCADOR (persistente vía localStorage; si el navegador lo bloquea,
     igual funciona en memoria durante la sesión actual)
     ===================================================================== */
  function loadScoreboard(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      scoreboard = raw ? JSON.parse(raw) : [];
    }catch(e){ scoreboard = []; }
  }

  function persistScoreboard(){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(scoreboard)); }catch(e){ /* modo solo-memoria */ }
  }

  function addScore(finalScore, correct, total){
    scoreboard.push({ score:finalScore, correct, total, t:Date.now() });
    scoreboard.sort((a,b) => b.score - a.score);
    scoreboard = scoreboard.slice(0, CONFIG.MAX_SCOREBOARD);
    persistScoreboard();
  }

  function renderScoreboard(){
    if(scoreboard.length === 0){
      scoreboardEl.classList.add('hidden');
      scoreboardEl.innerHTML = '';
      return;
    }
    scoreboardEl.classList.remove('hidden');
    const medals = ['🥇','🥈','🥉'];
    scoreboardEl.innerHTML = '<p class="sb-title">🏆 Mejores puntajes</p>' +
      scoreboard.map((s,i) => `
        <div class="sb-row">
          <span class="sb-rank">${medals[i] || (i+1) + '.'}</span>
          <span class="sb-score">${s.score} pts</span>
          <span class="sb-detail">${s.correct}/${s.total}</span>
        </div>`).join('');
  }

  /* =====================================================================
     TEMPORIZADOR POR PREGUNTA
     ===================================================================== */
  function startTimer(){
    timeLeft = CONFIG.TIME_PER_QUESTION;
    timerFillEl.classList.remove('low');
    timerFillEl.style.transition = 'none';
    timerFillEl.style.width = '100%';
    void timerFillEl.offsetWidth; // fuerza reflow para reiniciar la animación
    timerFillEl.style.transition = `width ${CONFIG.TIME_PER_QUESTION}s linear`;
    timerFillEl.style.width = '0%';

    clearInterval(timerInterval);
    timerInterval = setInterval(() => {
      timeLeft = Math.max(0, timeLeft - 0.1);
      if(timeLeft <= CONFIG.TIME_PER_QUESTION * 0.3) timerFillEl.classList.add('low');
      if(timeLeft <= 0){
        clearInterval(timerInterval);
        handleAnswer(-1); // se acabó el tiempo, no se seleccionó nada
      }
    }, 100);
  }

  /* =====================================================================
     RENDER DE PREGUNTAS
     ===================================================================== */
  function renderQuestion(){
    answered = false;
    const q = currentGameQuestions[currentIndex];

    catChip.textContent = q.category;
    catChip.className = 'chip chip-' + q.category.toLowerCase();
    qCounter.textContent = `${currentIndex + 1} / ${currentGameQuestions.length}`;
    questionText.textContent = q.q;

    optionsWrap.innerHTML = '';
    optionEls = [];
    const letters = ['A','B','C','D'];
    q.options.forEach((opt, i) => {
      const btn = document.createElement('button');
      btn.className = 'option';
      btn.innerHTML = `<span class="opt-letter">${letters[i]}</span><span class="opt-text"></span>`;
      btn.querySelector('.opt-text').textContent = opt;
      btn.addEventListener('click', () => handleAnswer(i));
      optionsWrap.appendChild(btn);
      optionEls.push(btn);
    });

    questionCard.classList.remove('enter');
    void questionCard.offsetWidth;
    questionCard.classList.add('enter');

    startTimer();
  }

  function computePoints(isCorrect){
    if(!isCorrect) return 0;
    const frac = Math.max(0, timeLeft / CONFIG.TIME_PER_QUESTION);
    return Math.round(CONFIG.BASE_POINTS + CONFIG.MAX_SPEED_BONUS * frac);
  }

  function updateScoreDisplay(pointsEarned){
    liveScoreEl.textContent = `⭐ ${score}`;
    if(pointsEarned > 0){
      const pop = document.createElement('span');
      pop.className = 'score-pop';
      pop.textContent = `+${pointsEarned}`;
      liveScoreEl.appendChild(pop);
      setTimeout(() => pop.remove(), 900);
    }
  }

  function handleAnswer(selectedIndex){
    if(answered) return;
    answered = true;
    clearInterval(timerInterval);

    const q = currentGameQuestions[currentIndex];
    const isCorrect = selectedIndex === q.correct;
    const pts = computePoints(isCorrect);
    score += pts;
    if(isCorrect) correctCount++;

    optionEls.forEach((btn, i) => {
      btn.classList.add('locked');
      if(i === q.correct) btn.classList.add('correct');
      else if(i === selectedIndex) btn.classList.add('incorrect');
      else btn.classList.add('dim');
    });

    updateScoreDisplay(pts);

    setTimeout(() => {
      currentIndex++;
      if(currentIndex < currentGameQuestions.length){
        renderQuestion();
      } else {
        endGame();
      }
    }, CONFIG.FEEDBACK_DELAY);
  }

  /* =====================================================================
     INICIO / FIN DE PARTIDA
     ===================================================================== */
  function startGame(){
    score = 0;
    correctCount = 0;
    currentIndex = 0;
    currentGameQuestions = shuffle([...QUESTION_BANK])
      .slice(0, CONFIG.QUESTIONS_PER_GAME)
      .map(prepareQuestion);
    maxPossibleScore = currentGameQuestions.length * (CONFIG.BASE_POINTS + CONFIG.MAX_SPEED_BONUS);

    liveScoreEl.innerHTML = '⭐ 0';
    showScreen('quiz');
    renderQuestion();
    tryFullscreen();
  }

  function tierFor(pct){
    if(pct >= .85) return { cls:'tier-1', label:'¡Excelente! 🏆' };
    if(pct >= .60) return { cls:'tier-2', label:'¡Muy bien! 👏' };
    if(pct >= .35) return { cls:'tier-3', label:'¡Bien! 💪' };
    return { cls:'tier-4', label:'¡Sigue aprendiendo! 📚' };
  }

  function endGame(){
    addScore(score, correctCount, currentGameQuestions.length);

    endScoreEl.textContent = score;
    endCorrectEl.textContent = `${correctCount}/${currentGameQuestions.length} correctas`;
    const pct = maxPossibleScore > 0 ? score / maxPossibleScore : 0;
    const tier = tierFor(pct);
    endTierEl.textContent = tier.label;
    endTierEl.className = 'end-tier ' + tier.cls;

    endOverlay.classList.remove('hidden');

    let remaining = Math.ceil(CONFIG.END_AUTO_RETURN / 1000);
    countdownNum.textContent = remaining;
    ringFg.style.transition = 'none';
    ringFg.style.strokeDashoffset = '0';
    void ringFg.offsetWidth;
    ringFg.style.transition = `stroke-dashoffset ${CONFIG.END_AUTO_RETURN}ms linear`;
    ringFg.style.strokeDashoffset = String(CIRC);

    clearInterval(endCountdownInterval);
    endCountdownInterval = setInterval(() => {
      remaining -= 1;
      countdownNum.textContent = Math.max(remaining, 0);
      if(remaining <= 0) clearInterval(endCountdownInterval);
    }, 1000);

    clearTimeout(endReturnTimeout);
    endReturnTimeout = setTimeout(returnToStart, CONFIG.END_AUTO_RETURN);
  }

  function returnToStart(){
    clearTimeout(endReturnTimeout);
    clearInterval(endCountdownInterval);
    endOverlay.classList.add('hidden');
    showScreen('start');
    renderScoreboard();
  }

  // Tocar la tarjeta final permite continuar antes de los 5s
  endCard.addEventListener('click', returnToStart);

  /* =====================================================================
     PANTALLA COMPLETA (mejor esfuerzo; el modo kiosco de Chrome/Edge en
     Windows es el método robusto, ver instrucciones de despliegue)
     ===================================================================== */
  function tryFullscreen(){
    try{
      const el = document.documentElement;
      const req = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
      if(req) req.call(el).catch(() => {});
    }catch(e){ /* silencioso: algunos navegadores/iframes lo bloquean */ }
  }

  /* =====================================================================
     ARRANQUE
     ===================================================================== */
  btnIniciar.addEventListener('click', startGame);
  loadScoreboard();
  renderScoreboard();
})();
</script>
</body>
</html>
